
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Forum</title>
    <link rel="icon" href="data:,">

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
            color: #222;
        }

        input, textarea, button {
            padding: 10px;
            margin: 5px 0;
            font-family: inherit;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            cursor: pointer;
        }

        .post {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }

        .post-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .reply {
            border-left: 3px solid #ccc;
            padding-left: 12px;
            margin: 12px 0;
        }

        .replies-area {
            margin-top: 15px;
        }

        .post-meta {
            color: #777;
            font-size: 12px;
        }

        #status {
            color: #16803c;
        }

        .error {
            color: red !important;
        }
    </style>
</head>

<body>

    <h1>Community Forum</h1>

    <p id="status">Connecting to Supabase...</p>

  
<h2>Create a post</h2>

<input
    id="username"
    type="text"
    maxlength="25"
    placeholder="Your username"
>

<input
    id="postTitle"
    type="text"
    maxlength="150"
    placeholder="Post title"
>

<textarea
    id="postContent"
    maxlength="10000"
    placeholder="Write something..."
></textarea>

<label for="mediaFile">Attach an image, GIF, or MP4:</label>
<input
    id="mediaFile"
    type="file"
    accept="image/jpeg,image/png,image/webp,image/gif,video/mp4"
>

<button id="publishButton" onclick="createPost()">
    Publish Post
</button>

    <hr>

    <h2>Posts</h2>

    <div id="posts">Loading posts...</div>

    <script>
// add this near beginning of javascript
        document.getElementById("username").value =
        localStorage.getItem("forumUsername") || "";

        
        // ==========================================
        // 1. SUPABASE CONFIGURATION
        // ==========================================

        const SUPABASE_URL = "https://ezgvqpasqentcyohhdcs.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hmbwFdChJYxB7Ra48hmn8g_ga04W7Zx";

        // Check whether the Supabase library loaded.
        if (!window.supabase || !window.supabase.createClient) {
            document.getElementById("status").textContent =
                "Error: Supabase library failed to load. Check your internet connection or CDN.";
            document.getElementById("status").className = "error";

            throw new Error("Supabase library unavailable.");
        }

        // Create the Supabase client.
        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        let currentUser = null;


        // ==========================================
        // 2. ANONYMOUS AUTHENTICATION
        // ==========================================

        async function initialize() {

            const status = document.getElementById("status");

            try {

                const { data: { session }, error } =
                    await db.auth.getSession();

                if (error) throw error;

                if (session) {

                    currentUser = session.user;

                } else {

                    const { data, error } =
                        await db.auth.signInAnonymously();

                    if (error) throw error;

                    currentUser = data.user;
                }

                status.textContent = "Connected anonymously.";

                loadPosts();

            } catch (error) {

                status.textContent = "Connection error: " + error.message;
                status.className = "error";

                console.error(error);
            }
        }


        // ==========================================
        // 3. CREATE A POST
        // ==========================================

        
async function createPost() {

    if (!currentUser) {
        alert("You are not connected yet.");
        return;
    }

    const username = document.getElementById("username").value.trim();
    const title = document.getElementById("postTitle").value.trim();
    const content = document.getElementById("postContent").value.trim();
    const file = document.getElementById("mediaFile").files[0];

    if (!username || !title || !content) {
        alert("Please enter a username, title, and message.");
        return;
    }

    if (username.length > 25) {
        alert("Username must be 25 characters or fewer.");
        return;
    }

    if (file && file.size > 50 * 1024 * 1024) {
        alert("Maximum file size is 50 MB.");
        return;
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif",
        "video/mp4"
    ];

    if (file && !allowedTypes.includes(file.type)) {
        alert("Only images, GIFs, and MP4 videos are allowed.");
        return;
    }

    const button = document.getElementById("publishButton");
    button.disabled = true;

    let mediaUrl = null;
    let mediaType = null;

    try {

        // Upload media if a file was selected
        if (file) {

            const extension = file.name.split(".").pop().toLowerCase();
            const filePath =
                currentUser.id + "/" + crypto.randomUUID() + "." + extension;

            const { error: uploadError } = await db.storage
                .from("forum-media")
                .upload(filePath, file, {
                    contentType: file.type,
                    upsert: false
                });

            if (uploadError) throw uploadError;

            const { data } = db.storage
                .from("forum-media")
                .getPublicUrl(filePath);

            mediaUrl = data.publicUrl;
            mediaType = file.type.startsWith("video/")
                ? "video"
                : "image";
        }

        // Save the post
        const { error } = await db
            .from("posts")
            .insert({
                user_id: currentUser.id,
                username: username,
                title: title,
                content: content,
                media_url: mediaUrl,
                media_type: mediaType
            });

        if (error) throw error;

        // Remember the username on this browser
        localStorage.setItem("forumUsername", username);

        document.getElementById("postTitle").value = "";
        document.getElementById("postContent").value = "";
        document.getElementById("mediaFile").value = "";

        await loadPosts();

    } catch (error) {

        alert("Could not publish post: " + error.message);
        console.error(error);

    } finally {

        button.disabled = false;
    }
}



        // ==========================================
        // 4. LOAD POSTS
        // ==========================================

 
async function loadPosts() {

    const container = document.getElementById("posts");

    container.textContent = "Loading posts...";

    try {

        const { data: posts, error } = await db
            .from("posts")
            .select("*")
            .order("created_at", { ascending: false });

        if (error) throw error;

        container.replaceChildren();

        if (!posts || posts.length === 0) {
            container.textContent = "No posts yet. Be the first!";
            return;
        }

        for (const post of posts) {

            const postElement = document.createElement("div");
            postElement.className = "post";

            // USERNAME
            const usernameElement = document.createElement("p");
            usernameElement.textContent =
                "Posted by: " + (post.username || "Anonymous");
            usernameElement.className = "post-meta";

            // TITLE
            const titleElement = document.createElement("h3");
            titleElement.textContent = post.title;

            // CONTENT
            const contentElement = document.createElement("p");
            contentElement.className = "post-content";
            contentElement.textContent = post.content;

            // MEDIA
            let mediaElement = null;

            if (post.media_url) {

                if (post.media_type === "video") {

                    mediaElement = document.createElement("video");
                    mediaElement.src = post.media_url;
                    mediaElement.controls = true;
                    mediaElement.preload = "metadata";

                } else {

                    mediaElement = document.createElement("img");
                    mediaElement.src = post.media_url;
                    mediaElement.alt = "Post attachment";
                    mediaElement.loading = "lazy";
                }

                mediaElement.style.maxWidth = "100%";
                mediaElement.style.maxHeight = "500px";
                mediaElement.style.borderRadius = "8px";
            }

            // DATE
            const meta = document.createElement("p");
            meta.className = "post-meta";
            meta.textContent =
                "Posted: " + new Date(post.created_at).toLocaleString();

            // VOTES
            const voteCount = await getVoteCount(post.id);

            const votes = document.createElement("p");
            votes.textContent = "Score: " + voteCount;

            const upvote = document.createElement("button");
            upvote.textContent = "▲ Upvote";
            upvote.onclick = () => vote(post.id, 1);

            const downvote = document.createElement("button");
            downvote.textContent = "▼ Downvote";
            downvote.onclick = () => vote(post.id, -1);

            // REPLIES
            const replyButton = document.createElement("button");
            replyButton.textContent = "Replies";

            const repliesArea = document.createElement("div");
            repliesArea.className = "replies-area";
            repliesArea.hidden = true;

            replyButton.onclick = async () => {

                repliesArea.hidden = !repliesArea.hidden;

                if (!repliesArea.hidden) {
                    await loadReplies(post.id, repliesArea);
                }
            };

            // DELETE POST
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete Post";

            deleteButton.hidden =
                post.user_id !== currentUser.id && !isAdmin;

            deleteButton.onclick = () => deletePost(post.id);

            // ASSEMBLE POST
            postElement.append(
                usernameElement,
                titleElement,
                contentElement
            );

            if (mediaElement) {
                postElement.appendChild(mediaElement);
            }

            postElement.append(
                meta,
                votes,
                upvote,
                downvote,
                replyButton,
                deleteButton,
                repliesArea
            );

            container.appendChild(postElement);
        }

    } catch (error) {

        container.textContent =
            "Error loading posts: " + error.message;

        console.error("Post loading error:", error);
    }
}



        // ==========================================
        // 5. GET VOTE COUNT
        // ==========================================

        async function getVoteCount(postId) {

            const { data, error } = await db
                .from("votes")
                .select("vote")
                .eq("post_id", postId);

            if (error) {
                console.error(error);
                return 0;
            }

            return data.reduce(
                (total, item) => total + item.vote,
                0
            );
        }


        // ==========================================
        // 6. UPVOTE / DOWNVOTE
        // ==========================================

        async function vote(postId, value) {

            try {

                const { error } = await db
                    .from("votes")
                    .upsert(
                        {
                            post_id: postId,
                            user_id: currentUser.id,
                            vote: value
                        },
                        {
                            onConflict: "post_id,user_id"
                        }
                    );

                if (error) throw error;

                await loadPosts();

            } catch (error) {

                alert("Voting error: " + error.message);
            }
        }


        // ==========================================
        // 7. LOAD REPLIES
        // ==========================================

        async function loadReplies(postId, container) {

            try {

                const { data, error } = await db
                    .from("replies")
                    .select("*")
                    .eq("post_id", postId)
                    .order("created_at", { ascending: true });

                if (error) throw error;

                container.replaceChildren();

                const heading = document.createElement("h4");
                heading.textContent = "Replies (" + data.length + ")";

                container.appendChild(heading);

                for (const reply of data) {

                    const replyElement = document.createElement("div");
                    replyElement.className = "reply";

                    const replyText = document.createElement("p");
                    replyText.textContent = reply.content;

                    replyElement.appendChild(replyText);

                    if (reply.user_id === currentUser.id) {

                        const deleteButton = document.createElement("button");

                        deleteButton.textContent = "Delete Reply";

                        deleteButton.onclick = () =>
                            deleteReply(reply.id, postId, container);

                        replyElement.appendChild(deleteButton);
                    }

                    container.appendChild(replyElement);
                }

                const replyInput = document.createElement("textarea");
                replyInput.placeholder = "Write a reply...";
                replyInput.maxLength = 2000;

                const submitButton = document.createElement("button");
                submitButton.textContent = "Send Reply";

                submitButton.onclick = async () => {

                    const content = replyInput.value.trim();

                    if (!content) return;

                    submitButton.disabled = true;

                    try {

                        const { error } = await db
                            .from("replies")
                            .insert({
                                post_id: postId,
                                user_id: currentUser.id,
                                content: content
                            });

                        if (error) throw error;

                        await loadReplies(postId, container);

                    } catch (error) {

                        alert("Reply error: " + error.message);

                    } finally {

                        submitButton.disabled = false;
                    }
                };

                container.append(replyInput, submitButton);

            } catch (error) {

                container.textContent =
                    "Error loading replies: " + error.message;
            }
        }


        // ==========================================
        // 8. DELETE POST
        // ==========================================

        async function deletePost(postId) {

            if (!confirm("Are you sure you want to delete this post?")) {
                return;
            }

            try {

                const { error } = await db
                    .from("posts")
                    .delete()
                    .eq("id", postId)
                    .eq("user_id", currentUser.id);

                if (error) throw error;

                await loadPosts();

            } catch (error) {

                alert("Delete error: " + error.message);
            }
        }


        // ==========================================
        // 9. DELETE REPLY
        // ==========================================

        async function deleteReply(replyId, postId, container) {

            try {

                const { error } = await db
                    .from("replies")
                    .delete()
                    .eq("id", replyId)
                    .eq("user_id", currentUser.id);

                if (error) throw error;

                await loadReplies(postId, container);

            } catch (error) {

                alert("Delete error: " + error.message);
            }
        }


        // ==========================================
        // 10. START THE FORUM
        // ==========================================

        initialize();

    </script>

</body>
</html>
