        * {
            box-sizing: border-box;

        html {
            scroll-behavior: smooth;

        @view-transition {

        body {
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 50px;
            font-family: 'Google Sans', Arial, sans-serif;
            color: #e4e4e7;
            background: #080810 url("https://imglink.cc/cdn/mJXIEE9M_k.jpg") center / cover fixed no-repeat;
            line-height: 1.6;
            overflow-x: clip;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20px;
            z-index: -1;
            background:
                linear-gradient(rgba(0,0,0,.78), rgba(0,0,0,.78)),
                url("https://imglink.cc/cdn/mJXIEE9M_k.jpg") center / cover no-repeat;
            filter: blur(8px);
        }

        button, input, textarea, select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* HEADER */
/* =========================================
   MAIN WEBSITE HEADER
   Matches index.html EXACTLY
========================================= */

header {
    position: relative;
    background-color: #000000;
    color: #ffffff;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    z-index: 1;
}

/* Diffused Multi-Color RGB Glow */
header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        90deg,
        #ff0055,
        #ff7700,
        #ffdd00,
        #00ff88,
        #00bbff,
        #aa00ff,
        #ff0055
    );
    background-size: 200% 200%;
    filter: blur(18px);
    opacity: 0.85;
    z-index: -1;
    animation: rgbShift 6s linear infinite;
}

/* Website title */
header h1 {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font-size: 1.25rem;
    font-weight: bold;
    letter-spacing: -1px;
}

/* Navigation links */
nav a {
  position: relative;
  color: #ffffff;
  text-decoration: none;
  margin-left: 20px;
  font-size: 0.95rem;
  padding-bottom: 4px;
}

nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 2px;
  background-color: #ffffff;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}

nav a:hover::after {
  transform: scaleX(1);
}


/* Social icons */
.social-icons {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
}

.social-icon {
    color: #ffffff;
    display: flex;
    align-items: center;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.social-icon:hover {
    opacity: 0.9;
    transform: translateY(-2px);
}




@view-transition {
  navigation: auto;
}


    

/* RGB animation */
@keyframes rgbShift {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 200% 50%;
    }
}


/* fix on mobile */
    @media (max-width: 768px) {
  header div {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
  }

  header h1 {
    position: static !important;
    display: block !important;
    margin: 0 0 12px 0 !important; /* Forces space below the title */
    padding: 0 !important;
    line-height: 1.2 !important;
    transform: none !important;
  }

  header nav {
    position: static !important;
    display: flex !important;
    justify-content: center !important;
    gap: 16px !important;
    margin: 0 !important;
    padding: 0 !important;
    line-height: 1.2 !important;
    transform: none !important;
  }

  header nav a {
    position: static !important;
    margin: 0 !important;
    padding: 0 !important;
  }
}

    
/* Disable RGB on mobile */
@media (max-width: 768px) {
    header {
        background: #000000 !important;
    }

    header::before {
        display: none !important;
        animation: none !important;
    }
}

               .header-button {

        /* POSTS */

        #posts {
            display: flex;

            gap: 16px;

        .post {
            min-width: 0;
            padding: 21px;
            border: 1px solid rgba(255,255,255,.12);

            background: rgba(255,255,255,.045);

            animation: messageAppear .25s ease;

        @keyframes messageAppear {

        .post-topline {

        .post-content {

        /* POPUP SYSTEM */

        .popup-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(0,0,0,.78);
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity .25s ease;
        }

        .popup-overlay[hidden] {
            display: none;
        }

        .popup-overlay.active {
            opacity: 1;
        }

        .notification-popup {
            position: relative;
            width: 100%;
            max-width: 540px;
            max-height: min(85vh, 850px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(0,220,255,.35);
            border-radius: 10px;
            background: #080810;
            color: white;
            box-shadow:
                0 0 25px rgba(0,200,255,.12),
                0 15px 60px rgba(0,0,0,.7);
            transform: translateY(20px) scale(.97);
            transition: transform .3s ease;
        }

        .popup-overlay.active .notification-popup {
            transform: translateY(0) scale(1);
        }

        .popup-header {
            position: relative;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 17px 22px;
            background: #000;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .popup-header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(
                90deg,
                #ff0055,#ff7700,#ffdd00,#00ff88,
                #00bbff,#aa00ff,#ff0055
            );
            background-size: 200% 200%;
            animation: rgbShift 6s linear infinite;
        }

        .popup-header h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
        }

        .popup-close {
            border: 0;
            background: transparent;
            color: #aaa;
            font-size: 27px;
            line-height: 1;
            transition: .2s;
        }

        .popup-close:hover {
            color: #00d9ff;
            transform: rotate(90deg);
        }

        .popup-content {
            padding: 22px;
            overflow-y: auto;
        }

        .popup-content h3 {
            margin: 0 0 9px;
            color: #00d9ff;
            font-size: 1.2rem;
        }

        .popup-content p {
            margin: 0;
            color: #bbb;
            line-height: 1.65;
            font-size: .95rem;
            white-space: pre-wrap;
        }

        .popup-footer {
            flex-shrink: 0;
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            padding: 0 22px 20px;
        }

        .popup-confirm {
            padding: 10px 20px;
            border: 1px solid #00d9ff;
            border-radius: 6px;
            background: transparent;
            color: #00d9ff;
            font-size: .9rem;
            transition: .2s;
        }

        .popup-confirm:hover {
            background: #00d9ff;
            color: #000;
        }

        .popup-cancel {
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 6px;
            background: rgba(255,255,255,.06);
            color: #ccc;
        }

        /* POPUP FORMS */

        .dialog-field {
            margin-bottom: 16px;

        .dialog-input,

        .file-preview-name {
            margin-top: 6px;

        }

        .settings-section {
            padding: 13px 0;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }

        .settings-section:last-child {
            border-bottom: 0;

        .settings-section h4 {

            color: #7dd3fc;
            font-size: 13px;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 9px 0;
        }

        .settings-row span {
            color: #ccc;
            font-size: 13px;
        }

        /* CUSTOM CURSOR */

        @media (hover: hover) and (pointer: fine) {
            html, html *, body, body *,
            body *::before, body *::after {
                cursor: none !important;
            }

            .cursor-dot {
                position: fixed;
                top: 0;
                left: 0;
                width: 6px;
                height: 6px;
                background: #00f3ff;
                border-radius: 50%;
                box-shadow: 0 0 8px #00f3ff;
                pointer-events: none;
                z-index: 100001;
                transform: translate(-50%,-50%);
            }

            .cursor-ring {
                position: fixed;
                top: 0;
                left: 0;
                width: 14px;
                height: 14px;
                border: 2px solid rgba(0,243,255,.8);
                border-radius: 50%;
                box-shadow: 0 0 12px rgba(0,243,255,.4);
                pointer-events: none;
                z-index: 100001;
                transform: translate(-50%,-50%);
                transition: width .2s, height .2s, border-color .2s;
            }

            .cursor-ring.hover {
                width: 12px;
                height: 12px;
                border-color: #8af9ff;
                box-shadow: 0 0 16px rgba(138,249,255,.6);
            }

            .cursor-dot.hover {
                background: #8af9ff;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .cursor-dot, .cursor-ring {
                display: none;
            }
        }

        /* RESPONSIVE */

        @media (max-width: 768px) {
            header {
                min-height: 68px;
                padding: 13px 15px;
                background: #000;
            }

            header::before {
                display: none;
                animation: none;
            }

            .header-title {
                font-size: 1.1rem;
            }

            .header-button {
                width: 38px;
                height: 38px;
            }

            .page-container {
                width: 96%;
                margin: 24px auto;
            }

            .page-heading h2 {
                font-size: 1.6rem;
            }

            .forum-container {
                padding: 14px;
                border-radius: 12px;
            }

            .forum-toolbar {
                align-items: stretch;
            }

            .toolbar-left {
                min-width: 100%;
            }

            .sort-select {
                flex: 1;
            }

            .post {
                padding: 15px;
            }

            .inline-reply-form {
                flex-direction: column;
            }

            .inline-reply-form button {
                align-self: flex-end;
            }
        }

        @media (max-width: 450px) {
            .page-container {
                width: 100%;
                padding: 0 9px;
            }

            .post-actions {
                gap: 5px;
            }

            .vote-button,
            .action-button {
                padding: 7px 8px;
                font-size: 11px;
            }

            .popup-overlay {
                padding: 10px;
            }

            .popup-content {
                padding: 17px;
            }

            .popup-footer {
                padding: 0 17px 17px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }

        /* for the svg */
        .icon-text-stack {
  display: flex;
  flex-direction: column; /* Stacks items vertically */
  align-items: center;    /* Centers them horizontally (use flex-start for left-align) */
  gap: 8px;               /* Controls the space between the SVG and the text */
}

/* =========================================
   2. POPUP SYSTEM
========================================= */

const popup = document.getElementById("notificationPopup");
const popupTitle = document.getElementById("popupTitle");
const popupContent = document.getElementById("popupContent");
const popupFooter = document.getElementById("popupFooter");
const popupClose = document.getElementById("popupClose");

function openPopup(title, heading, message, buttons = [], options = {}) {
    previousFocus = document.activeElement;
    popupCanClose = options.closable !== false;

    popupTitle.textContent = title;

    popupContent.replaceChildren();

    if (heading) {
        const h3 = document.createElement("h3");
        h3.textContent = heading;
        popupContent.appendChild(h3);
    }

    if (message) {
        const p = document.createElement("p");
        p.textContent = message;
        popupContent.appendChild(p);
    }

    popupFooter.replaceChildren();

    for (const buttonInfo of buttons) {
        const button = document.createElement("button");

        button.type = "button";
        button.textContent = buttonInfo.text;
        button.className = buttonInfo.primary
            ? "popup-confirm"
            : "popup-cancel";

        button.addEventListener("click", buttonInfo.action);

        popupFooter.appendChild(button);
    }

    popupClose.hidden = !popupCanClose;

    popup.hidden = false;
    document.body.style.overflow = "hidden";

    requestAnimationFrame(() => {
        popup.classList.add("active");

        const firstButton = popupFooter.querySelector("button");
        if (firstButton) firstButton.focus();
        else popupClose.focus();
    });
}

function closePopup() {
    if (popup.hidden || !popupCanClose) return;

    popup.classList.remove("active");

    setTimeout(() => {
        popup.hidden = true;
        document.body.style.overflow = "";

        if (previousFocus && typeof previousFocus.focus === "function") {
            previousFocus.focus();
        }
    }, 250);
}

function showMessage(title, message) {
    openPopup(
        title,
        title,
        message,
        [{ text: "OK", primary: true, action: closePopup }]
    );
}

function askConfirmation(title, message) {
    return new Promise(resolve => {
        openPopup(
            title,
            title,
            message,
            [
                {
                    text: "Cancel",
                    action: () => {
                        closePopup();
                        resolve(false);
                    }
                },
                {
                    text: "Confirm",
                    primary: true,
                    action: () => {
                        closePopup();
                        resolve(true);
                    }
                }
            ]
        );
    });
}

popupClose.addEventListener("click", closePopup);

popup.addEventListener("click", event => {
    if (event.target === popup) closePopup();
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !popup.hidden) {
        closePopup();
    }

    if (event.key === "Tab" && !popup.hidden) {
        const focusable = [
            ...popup.querySelectorAll(
                'button:not([hidden]), input:not([hidden]), textarea:not([hidden]), select:not([hidden])'
            )
        ].filter(element => !element.disabled);

        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
        }
    }
});


/* =========================================
   3. PROFILE / USERNAME SYSTEM
========================================= */

async function loadCurrentProfile() {
    const { data, error } = await db
        .from("profiles")
        .select("user_id, username")
        .eq("user_id", currentUser.id)
        .maybeSingle();

    if (error) throw error;

    if (data) {
        currentProfile = data;
        localStorage.setItem("forumUsername", data.username);
        return;
    }

    const oldUsername = localStorage.getItem("forumUsername");

    if (oldUsername && oldUsername.trim().length >= 3) {
        try {
            await saveUsername(oldUsername.trim());
            return;
        } catch (error) {
            console.warn("Could not migrate old username:", error);
        }
    }

    await promptForUsername();
}

async function saveUsername(username) {
    username = username.trim();

    if (username.length < 3 || username.length > 20) {
        throw new Error("Username must be between 3 and 20 characters.");
    }

    if (!/^[a-zA-Z0-9_ -]+$/.test(username)) {
        throw new Error(
            "Use only letters, numbers, spaces, hyphens, and underscores."
        );
    }

    const { data, error } = await db
        .from("profiles")
        .upsert({
            user_id: currentUser.id,
            username: username
        }, {
            onConflict: "user_id"
        })
        .select()
        .single();

    if (error) {
        if (error.code === "23505") {
            throw new Error("That username is already taken.");
        }
        throw error;
    }

    currentProfile = data;
    localStorage.setItem("forumUsername", username);
    profileNames[currentUser.id] = username;
}

function promptForUsername() {
    return new Promise(resolve => {
        openPopup(
            "Welcome",
            "Choose your username",
            "Choose the name that other people will see next to your posts and replies.",
            [],
            { closable: false }
        );

        const field = document.createElement("div");
        field.className = "dialog-field";

        const label = document.createElement("label");
        label.textContent = "Username";

        const input = document.createElement("input");
        input.className = "dialog-input";
        input.placeholder = "Choose a username";
        input.maxLength = 20;
        input.autocomplete = "nickname";

        const hint = document.createElement("span");
        hint.className = "field-hint";
        hint.textContent = "3–20 characters. Letters, numbers, spaces, - and _.";

        field.append(label, input, hint);
        popupContent.appendChild(field);

        const button = document.createElement("button");
        button.className = "popup-confirm";
        button.textContent = "Continue";

        popupFooter.appendChild(button);

        button.addEventListener("click", async () => {
            button.disabled = true;

            try {
                await saveUsername(input.value);
                popupCanClose = true;
                closePopup();
                resolve();
            } catch (error) {
                hint.textContent = error.message;
                hint.style.color = "#f87171";
                button.disabled = false;
            }
        });

        input.addEventListener("keydown", event => {
            if (event.key === "Enter") button.click();
        });

        input.focus();
    });
}

async function loadProfileNames() {
    const { data, error } = await db
        .from("profiles")
        .select("user_id, username");

    if (error) throw error;

    profileNames = {};

    for (const profile of data || []) {
        profileNames[profile.user_id] = profile.username;
    }

    if (currentProfile) {
        profileNames[currentUser.id] = currentProfile.username;
    }
}

function displayUsername(userId, fallback) {
    return profileNames[userId] || fallback || "Anonymous";
}

async function initialize() {
    const status = document.getElementById("status");

    try {
        const { data: { session }, error } =
            await db.auth.getSession();

        if (error) throw error;

        if (session) {
            currentUser = session.user;
        } else {
            const { data, error: authError } =
                await db.auth.signInAnonymously();

            if (authError) throw authError;

            currentUser = data.user;
        }

        await loadCurrentProfile();
        await loadProfileNames();

        status.textContent =
            "Connected as " + currentProfile.username;

        await loadPosts();

    } catch (error) {
        console.error("Initialization error:", error);

        status.textContent = "Connection error: " + error.message;
        status.classList.add("error");
    }
}

            "image/png",
            "image/webp",

        publishButton.disabled = true;
        publishButton.textContent = "Publishing...";

                    .from("forum-media")
                    .getPublicUrl(uploadedPath);

                    .remove([uploadedPath]);

            showMessage("Could not publish post", error.message);

            publishButton.disabled = false;
            publishButton.textContent = "Publish";
        } finally {
            if (previewUrl) URL.revokeObjectURL(previewUrl);
        }

}


/* =========================================
   6. LOAD AND DISPLAY POSTS
========================================= */

async function loadPosts() {
    const container = document.getElementById("posts");

    container.innerHTML =
        '<div class="empty-state">Loading discussions...</div>';

    try {
        const { data: posts, error } = await db
            .from("posts")
            .select("*")
            .order("created_at", { ascending: false });

        if (error) throw error;

        allPosts = posts || [];

        if (allPosts.length) {
            const ids = allPosts.map(post => post.id);

            const { data: votes, error: voteError } = await db
                .from("votes")
                .select("post_id, user_id, vote")
                .in("post_id", ids);

            if (voteError) throw voteError;

            allPostVotes = votes || [];
        } else {
            allPostVotes = [];
        }

        renderPosts();

    } catch (error) {
        console.error("Post loading error:", error);

        container.textContent =
            "Error loading posts: " + error.message;
    }
}

function renderPosts() {
    const container = document.getElementById("posts");
    const search = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const sort = document.getElementById("sortSelect").value;

    let posts = [...allPosts];

    if (search) {
        posts = posts.filter(post =>
            (post.title || "").toLowerCase().includes(search) ||
            (post.content || "").toLowerCase().includes(search) ||
            displayUsername(post.user_id, post.username)
                .toLowerCase().includes(search)
        );
    }

    if (sort === "oldest") {
        posts.sort((a,b) =>
            new Date(a.created_at) - new Date(b.created_at)
        );
    } else if (sort === "top") {
        posts.sort((a,b) =>
            getPostScore(b.id) - getPostScore(a.id)
        );
    } else {
        posts.sort((a,b) =>
            new Date(b.created_at) - new Date(a.created_at)
        );
    }

    container.replaceChildren();

    if (!posts.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = search
            ? "No discussions match your search."
            : "No posts yet. Be the first to start a discussion!";

        container.appendChild(empty);
        return;
    }

    for (const post of posts) {
        container.appendChild(createPostElement(post));
    }
}

function getPostScore(postId) {
    return allPostVotes
        .filter(item => item.post_id === postId)
        .reduce((total,item) => total + item.vote, 0);
}

function createPostElement(post) {
    const element = document.createElement("article");
    element.className = "post";

    const top = document.createElement("div");
    top.className = "post-topline";

    const author = document.createElement("span");
    author.className = "post-author";
    author.textContent =
        displayUsername(post.user_id, post.username);

    const date = document.createElement("span");
    date.className = "post-date";
    date.textContent = formatDate(post.created_at);

    top.append(author,date);

    const title = document.createElement("h3");
    title.textContent = post.title;

    element.append(top,title);

    if (post.content) {
        const content = document.createElement("p");
        content.className = "post-content";
        content.textContent = post.content;
        element.appendChild(content);
    }

    if (post.media_url) {
        let media;

        if (post.media_type === "video") {
            media = document.createElement("video");
            media.controls = true;
            media.preload = "metadata";
        } else {
            media = document.createElement("img");
            media.alt = "Post attachment";
            media.loading = "lazy";
        }

        media.src = post.media_url;
        media.className = "post-media";
        element.appendChild(media);
    }

    const actions = document.createElement("div");
    actions.className = "post-actions";

    const ownVote = allPostVotes.find(item =>
        item.post_id === post.id &&
        item.user_id === currentUser.id
    );

    const upvote = document.createElement("button");
    upvote.className = "vote-button" +
        (ownVote?.vote === 1 ? " active-up" : "");
    upvote.textContent = "▲";
    upvote.title = "Upvote";
    upvote.setAttribute("aria-label", "Upvote");
    upvote.addEventListener("click", () => toggleVote(post.id, 1));

    const score = document.createElement("span");
    score.className = "post-score";
    score.textContent = getPostScore(post.id);

    const downvote = document.createElement("button");
    downvote.className = "vote-button" +
        (ownVote?.vote === -1 ? " active-down" : "");
    downvote.textContent = "▼";
    downvote.title = "Downvote";
    downvote.setAttribute("aria-label", "Downvote");
    downvote.addEventListener("click", () => toggleVote(post.id, -1));

    const replyButton = document.createElement("button");
    replyButton.className = "action-button";
    replyButton.textContent = "View replies";
    replyButton.addEventListener("click", async () => {
        repliesArea.classList.toggle("open");

        if (repliesArea.classList.contains("open")) {
            await loadReplies(post.id, repliesArea);
            replyButton.textContent = "Hide replies";
        } else {
            replyButton.textContent = "View replies";
        }
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "action-button post-delete";
    deleteButton.textContent = "Delete";
    deleteButton.addEventListener("click", () => deletePost(post));

    if (post.user_id !== currentUser.id) {
        deleteButton.hidden = true;
    }

    actions.append(upvote,score,downvote,replyButton,deleteButton);

    const repliesArea = document.createElement("div");
    repliesArea.className = "replies-area";

    element.append(actions,repliesArea);

    return element;
}

function formatDate(dateString) {
    const date = new Date(dateString);
    const seconds = Math.floor((Date.now() - date.getTime()) / 1000);

    if (seconds < 60) return "Just now";
    if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
    if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
    if (seconds < 604800) return Math.floor(seconds / 86400) + "d ago";

    return date.toLocaleDateString();
}

document.getElementById("searchInput")

document.getElementById("sortSelect")
    .addEventListener("change", renderPosts);


/* =========================================
   7. REVERSIBLE VOTING
========================================= */

async function toggleVote(postId, value) {
    try {
        const existing = allPostVotes.find(item =>
            item.post_id === postId &&
            item.user_id === currentUser.id
        );

        if (existing && existing.vote === value) {
            const { error } = await db
                .from("votes")
                .delete()
                .eq("post_id", postId)
                .eq("user_id", currentUser.id);

            if (error) throw error;

        } else {
            const { error } = await db
                .from("votes")
                .upsert({
                    post_id: postId,
                    user_id: currentUser.id,
                    vote: value
                }, {
                    onConflict: "post_id,user_id"
                });

            if (error) throw error;
        }

        await loadPosts();

    } catch (error) {
        console.error(error);
        showMessage("Voting error", error.message);
    }
}


/* =========================================
   8. NESTED REPLIES
========================================= */

async function loadReplies(postId, container) {
    container.innerHTML =
        '<div class="empty-state">Loading replies...</div>';

    try {
        const { data, error } = await db
            .from("replies")
            .select("*")
            .eq("post_id", postId)
            .order("created_at", { ascending: true });

        if (error) throw error;

        const replies = data || [];

        container.replaceChildren();

        const heading = document.createElement("h4");
        heading.className = "replies-heading";
        heading.textContent =
            "Discussion (" + replies.length + " replies)";

        container.appendChild(heading);

        const rootReplies = replies.filter(reply =>
            !reply.parent_reply_id
        );

        const children = {};

        for (const reply of replies) {
            if (reply.parent_reply_id) {
                if (!children[reply.parent_reply_id]) {
                    children[reply.parent_reply_id] = [];
                }

                children[reply.parent_reply_id].push(reply);
            }
        }

        if (!rootReplies.length) {
            const empty = document.createElement("p");
            empty.className = "empty-state";
            empty.textContent = "No replies yet. Start the conversation.";
            container.appendChild(empty);
        }

        for (const reply of rootReplies) {
            container.appendChild(
                createReplyElement(reply, children, postId, 0)
            );
        }

        container.appendChild(
            createReplyForm(postId, null, container)
        );

    } catch (error) {
        console.error(error);
        container.textContent = "Error loading replies: " + error.message;
    }
}

function createReplyElement(reply, children, postId, depth) {
    const element = document.createElement("div");
    element.className = "reply";

    const header = document.createElement("div");
    header.className = "reply-header";

    const author = document.createElement("span");
    author.className = "reply-author";
    author.textContent =
        displayUsername(reply.user_id, reply.username);

    const date = document.createElement("span");
    date.className = "reply-date";
    date.textContent = formatDate(reply.created_at);

    header.append(author,date);

    const content = document.createElement("p");
    content.className = "reply-content";
    content.textContent = reply.content;

    const actions = document.createElement("div");
    actions.className = "reply-actions";

    const replyButton = document.createElement("button");
    replyButton.textContent = "Reply";

    const nestedFormHolder = document.createElement("div");

    replyButton.addEventListener("click", () => {
        if (nestedFormHolder.hasChildNodes()) {
            nestedFormHolder.replaceChildren();
        } else {
            nestedFormHolder.appendChild(
                createReplyForm(postId, reply.id, null)
            );
        }
    });

    actions.appendChild(replyButton);

    if (reply.user_id === currentUser.id) {
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", () =>
            deleteReply(reply.id, postId)
        );

        actions.appendChild(deleteButton);
    }

    element.append(header,content,actions,nestedFormHolder);

    const childReplies = children[reply.id] || [];

    if (childReplies.length) {
        const nested = document.createElement("div");
        nested.className = "nested-replies";

        for (const child of childReplies) {
            nested.appendChild(
                createReplyElement(child, children, postId, depth + 1)
            );
        }

        element.appendChild(nested);
    }

    return element;
}

function createReplyForm(postId, parentReplyId, refreshContainer) {
    const form = document.createElement("form");
    form.className = "inline-reply-form";

    const textarea = document.createElement("textarea");
    textarea.placeholder = parentReplyId
        ? "Reply to this comment..."
        : "Write a reply...";
    textarea.maxLength = 2000;
    textarea.required = true;

    const button = document.createElement("button");
    button.className = "secondary-button";
    button.type = "submit";
    button.textContent = "Send";

    form.append(textarea,button);

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const content = textarea.value.trim();
        if (!content) return;

        button.disabled = true;
        button.textContent = "Sending...";

        try {
            const { error } = await db
                .from("replies")
                .insert({
                    post_id: postId,
                    parent_reply_id: parentReplyId,
                    user_id: currentUser.id,
                    username: currentProfile.username,
                    content
                });

            if (error) throw error;

            if (refreshContainer) {
                await loadReplies(postId, refreshContainer);
            } else {
                const repliesArea = form.closest(".replies-area");

                if (repliesArea) {
                    await loadReplies(postId, repliesArea);
                }
            }

        } catch (error) {
            console.error(error);
            showMessage("Reply error", error.message);
            button.disabled = false;
            button.textContent = "Send";
        }
    });

    return form;
}


/* =========================================
   9. DELETE POSTS AND REPLIES
========================================= */

async function deletePost(post) {
    const confirmed = await askConfirmation(
        "Delete post?",
        "This will permanently delete your post and its replies. This cannot be undone."
    );

    if (!confirmed) return;

    try {
        const { error } = await db
            .from("posts")
            .delete()
            .eq("id", post.id)
            .eq("user_id", currentUser.id);

        if (error) throw error;

        await loadPosts();

        showMessage("Post deleted", "Your post has been deleted.");

    } catch (error) {
        showMessage("Delete error", error.message);
    }
}

async function deleteReply(replyId, postId) {
    const confirmed = await askConfirmation(
        "Delete reply?",
        "Are you sure you want to delete this reply? Replies underneath it will also be deleted."
    );

    if (!confirmed) return;

    try {
        const { error } = await db
            .from("replies")
            .delete()
            .eq("id", replyId)
            .eq("user_id", currentUser.id);

        if (error) throw error;

        const areas = document.querySelectorAll(".replies-area.open");

        for (const area of areas) {
            if (area.closest(".post")) {
                const postTitle = area.closest(".post").querySelector("h3");
                const matchingPost = allPosts.find(p =>
                    p.title === postTitle.textContent
                );

                if (matchingPost && matchingPost.id === postId) {
                    await loadReplies(postId, area);
                    break;
                }
            }
        }

    } catch (error) {
        showMessage("Delete error", error.message);
    }
}


/* =========================================
   10. SETTINGS
========================================= */

document.getElementById("settingsButton")
    .addEventListener("click", openSettings);

function openSettings() {
    openPopup(
        "Settings",
        "Forum settings",
        "Manage your profile and send feedback."
    );

    const account = document.createElement("div");
    account.className = "settings-section";

    account.innerHTML = `
        <h4>ACCOUNT</h4>
        <div class="settings-row">
            <span>Current username</span>
            <strong id="settingsUsername"></strong>
        </div>
    `;

    account.querySelector("#settingsUsername").textContent =
        currentProfile.username;

    const changeName = document.createElement("button");
    changeName.className = "secondary-button";
    changeName.textContent = "Change username";
    changeName.addEventListener("click", openUsernameEditor);

    account.appendChild(changeName);

    const community = document.createElement("div");
    community.className = "settings-section";

    const heading = document.createElement("h4");
    heading.textContent = "COMMUNITY";

    const feedbackButton = document.createElement("button");
    feedbackButton.className = "secondary-button";
    feedbackButton.textContent = "Send feedback";
    feedbackButton.addEventListener("click", openFeedbackForm);

    const about = document.createElement("p");
    about.style.marginTop = "12px";
    about.textContent =
        "HSHCS Forum · Share ideas and take part in discussions.";

    community.append(heading,feedbackButton,about);

    popupContent.append(account,community);

    popupFooter.appendChild(
        makePopupButton("Close", closePopup, true)
    );
}

function makePopupButton(text, action, primary = false) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = primary ? "popup-confirm" : "popup-cancel";
    button.textContent = text;
    button.addEventListener("click", action);
    return button;
}

function openUsernameEditor() {
    openPopup(
        "Change username",
        "Update your username",
        "Your new username will appear on your posts and replies."
    );

    const field = document.createElement("div");
    field.className = "dialog-field";

    const label = document.createElement("label");
    label.textContent = "New username";

    const input = document.createElement("input");
    input.className = "dialog-input";
    input.maxLength = 20;
    input.value = currentProfile.username;

    const hint = document.createElement("span");
    hint.className = "field-hint";
    hint.textContent = "3–20 characters.";

    field.append(label,input,hint);
    popupContent.appendChild(field);

    popupFooter.appendChild(
        makePopupButton("Cancel", openSettings)
    );

    const save = makePopupButton("Save", async () => {
        save.disabled = true;

        try {
            await saveUsername(input.value);
            await loadProfileNames();

            document.getElementById("status").textContent =
                "Connected as " + currentProfile.username;

            closePopup();
            await loadPosts();

            showMessage("Username updated", "Your new username has been saved.");

        } catch (error) {
            hint.textContent = error.message;
            hint.style.color = "#f87171";
            save.disabled = false;
        }
    }, true);

    popupFooter.appendChild(save);
}


/* =========================================
   11. FEEDBACK
========================================= */

function openFeedbackForm() {
    openPopup(
        "Send feedback",
        "Help improve the forum",
        "Report a problem or suggest an improvement."
    );

    const form = document.createElement("form");

    form.innerHTML = `
        <div class="dialog-field">
            <label for="feedbackCategory">Category</label>
            <select id="feedbackCategory" class="dialog-select">
                <option value="Suggestion">Suggestion</option>
                <option value="Bug report">Bug report</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="dialog-field">
            <label for="feedbackMessage">Message</label>
            <textarea id="feedbackMessage"
                class="dialog-textarea"
                maxlength="3000"
                required
                placeholder="Describe your feedback..."></textarea>
        </div>

        <div class="dialog-field">
            <label for="feedbackEmail">Email (optional)</label>
            <input id="feedbackEmail"
                class="dialog-input"
                type="email"
                maxlength="254"
                placeholder="Your email address">
        </div>
    `;

    popupContent.appendChild(form);

    popupFooter.appendChild(
        makePopupButton("Cancel", openSettings)
    );

    const submit = makePopupButton("Submit feedback", async () => {
        const category = form.querySelector("#feedbackCategory").value;
        const message = form.querySelector("#feedbackMessage").value.trim();
        const email = form.querySelector("#feedbackEmail").value.trim();

        if (message.length < 5) {
            showMessage("More detail needed", "Please enter at least 5 characters.");
            return;
        }

        submit.disabled = true;

        try {
            const { error } = await db
                .from("forum_feedback")
                .insert({
                    user_id: currentUser.id,
                    username: currentProfile.username,
                    category,
                    message,
                    email: email || null
                });

            if (error) throw error;

            closePopup();

            showMessage(
                "Feedback submitted",
                "Thank you. Your feedback has been sent."
            );

        } catch (error) {
            showMessage("Could not submit feedback", error.message);
            submit.disabled = false;
        }
    }, true);

    popupFooter.appendChild(submit);
}


/* =========================================
   12. CUSTOM CURSOR
========================================= */

const cursorDot = document.querySelector(".cursor-dot");
const cursorRing = document.querySelector(".cursor-ring");

if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    document.addEventListener("mousemove", event => {
        cursorDot.style.left = event.clientX + "px";
        cursorDot.style.top = event.clientY + "px";

        cursorRing.style.left = event.clientX + "px";
        cursorRing.style.top = event.clientY + "px";
    });

    document.addEventListener("mouseover", event => {
        if (event.target.closest("button, a, input, textarea, select")) {
            cursorDot.classList.add("hover");
            cursorRing.classList.add("hover");
        } else {
            cursorDot.classList.remove("hover");
            cursorRing.classList.remove("hover");
        }
    });
}


/* =========================================
   13. START
========================================= */

initialize();

</script>
