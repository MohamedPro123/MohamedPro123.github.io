 <style>
    .img-container {
      width: 600px;
      height: 400px;
      overflow: hidden;
      border: 2px solid #ccc;
      cursor: zoom-in;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
      /* Cubic-bezier provides the "smooth fluid" feeling */
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
    }

    /* Target state when container gets the .zoomed class via JS */
    .img-container.zoomed {
      cursor: move;
    }
    .img-container.zoomed img {
      transform: scale(2.5); /* Target zoom level */
    }
  </style>
</head>
<body>

  <div class="img-container" id="zoomBox">
    <img src="https://cdn.prod.website-files.com/6a75f4d2f8fc25697308cb39/6abd9eab8625e1c0b4aca39b_HSHCS_100%20(1).jpg" alt="Vanilla Zoom">
  </div>

  <script>
    const box = document.getElementById('zoomBox');
    const img = box.querySelector('img');

    // 1. Click to toggle Zoom state
    box.addEventListener('click', (e) => {
      box.classList.toggle('zoomed');
      if (box.classList.contains('zoomed')) {
        updateOrigin(e);
      } else {
        img.style.transformOrigin = 'center center';
      }
    });

    // 2. Pan around smoothly based on cursor coordinates
    box.addEventListener('mousemove', (e) => {
      if (box.classList.contains('zoomed')) {
        updateOrigin(e);
      }
    });

    function updateOrigin(e) {
      const rect = box.getBoundingClientRect();
      // Calculate mouse position relative to the container boundaries
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      // Convert to percentages
      const xPercent = (x / rect.width) * 100;
      const yPercent = (y / rect.height) * 100;

      // Dynamically move the transformation anchor point
      img.style.transformOrigin = `${xPercent}% ${yPercent}%`;
    }

    // Reset zoom if mouse completely leaves container boundary
    box.addEventListener('mouseleave', () => {
      box.classList.remove('zoomed');
      img.style.transformOrigin = 'center center';
    });
  </script>
