<!-- 1. Chat Widget HTML -->
<div id="gemini-chat-box">
  <div id="chat-messages">
    <div class="msg bot">Hi! Ask me anything.</div>
  </div>
  <form id="chat-form">
    <input type="text" id="chat-input" placeholder="Type a message..." required />
    <button type="submit" id="chat-send">Send</button>
  </form>
</div>

<!-- 2. Simple Styling -->
<style>
  #gemini-chat-box {
    max-width: 450px;
    margin: 20px auto;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-family: sans-serif;
    overflow: hidden;
    background: #fff;
  }
  #chat-messages {
    height: 300px;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 80%;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    background: #0b57d0;
    color: white;
    align-self: flex-end;
  }
  .msg.bot {
    background: #f1f3f4;
    color: #202124;
    align-self: flex-start;
  }
  #chat-form {
    display: flex;
    border-top: 1px solid #ccc;
  }
  #chat-input {
    flex: 1;
    border: none;
    padding: 12px;
    font-size: 15px;
    outline: none;
  }
  #chat-send {
    background: #0b57d0;
    color: white;
    border: none;
    padding: 0 20px;
    cursor: pointer;
    font-weight: bold;
  }
  #chat-send:disabled {
    background: #9aa0a6;
  }
</style>

<!-- 3. Frontend JavaScript -->
<script>
  const WORKER_URL = "https://gemini-chat-proxy.mappinggerman04.workers.dev/";

  const chatForm = document.getElementById("chat-form");
  const chatInput = document.getElementById("chat-input");
  const chatMessages = document.getElementById("chat-messages");
  const chatSend = document.getElementById("chat-send");

  function appendMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `msg ${sender}`;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = chatInput.value.trim();
    if (!message) return;

    // Show user message and disable input while waiting
    appendMessage(message, "user");
    chatInput.value = "";
    chatInput.disabled = true;
    chatSend.disabled = true;

    const loadingBubble = appendMessage("Thinking...", "bot");

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      const data = await response.json();

      if (response.ok) {
        loadingBubble.textContent = data.reply;
      } else {
        loadingBubble.textContent = "Error: " + (data.error || "Could not reach Gemini.");
      }
    } catch (error) {
      loadingBubble.textContent = "Network error. Check your Worker URL or CORS settings.";
    } finally {
      chatInput.disabled = false;
      chatSend.disabled = false;
      chatInput.focus();
    }
  });
</script>
