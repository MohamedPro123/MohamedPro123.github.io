<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<title>Google Classroom</title>
<link rel="icon" href="https://imglink.cc/cdn/A1ldO2SbuE.webp">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<!-- pinned: an unpinned marked can change its API/file layout under you -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@view-transition{navigation:auto}
@keyframes rgbShift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes messageAppear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

body{margin:0;min-height:100vh;font-family:'Google Sans',Arial,sans-serif;background:#000;color:#e4e4e7;line-height:1.6;overflow-x:clip}
/* blurred fixed background (was position:absolute, which only covered the body height) */
body::before{content:"";position:fixed;inset:-30px;z-index:-1;filter:blur(8px);
  background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),url("https://imglink.cc/cdn/mJXIEE9M_k.jpg") center/cover no-repeat}

/* ---------- Popup ---------- */
.popup-overlay{position:fixed;inset:0;z-index:99999;display:flex;justify-content:center;align-items:center;padding:20px;background:rgba(0,0,0,.78);backdrop-filter:blur(5px);opacity:0;transition:opacity .25s ease}
.popup-overlay[hidden]{display:none}
.popup-overlay.active{opacity:1}
.notification-popup{position:relative;width:100%;max-width:450px;background:#080808;color:#fff;border:1px solid rgba(0,220,255,.35);border-radius:8px;overflow:hidden;box-shadow:0 0 25px rgba(0,200,255,.12),0 15px 60px rgba(0,0,0,.7);transform:translateY(20px) scale(.97);transition:transform .3s ease}
.popup-overlay.active .notification-popup{transform:none}
.popup-header{position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:#000;border-bottom:1px solid rgba(255,255,255,.08)}
.popup-header::before{content:"";position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,#ff0055,#ff7700,#ffdd00,#00ff88,#00bbff,#aa00ff,#ff0055);background-size:200% 200%;animation:rgbShift 6s linear infinite}
.popup-header h2{margin:0;font-size:1.2rem;font-weight:600}
.popup-close{background:transparent;border:none;color:#aaa;font-size:27px;line-height:1;transition:color .2s,transform .2s}
.popup-close:hover{color:#00d9ff;transform:rotate(90deg)}
.popup-content{padding:25px 22px}
.popup-content h3{margin:0 0 10px;color:#00d9ff;font-size:1.25rem}
.popup-content p{margin:0;color:#bbb;line-height:1.65;font-size:.95rem;white-space:pre-wrap}
.popup-footer{display:flex;justify-content:flex-end;padding:0 22px 22px}
.popup-confirm{padding:10px 22px;background:transparent;border:1px solid #00d9ff;border-radius:6px;color:#00d9ff;font-size:.9rem;transition:background .2s,color .2s}
.popup-confirm:hover{background:#00d9ff;color:#000}

/* ---------- Header ---------- */
header{position:relative;background:#000;color:#fff;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;gap:16px;z-index:1}
header::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ff0055,#ff7700,#ffdd00,#00ff88,#00bbff,#aa00ff,#ff0055);background-size:200% 200%;filter:blur(18px);opacity:.85;z-index:-1;animation:rgbShift 6s linear infinite}
header h1{position:absolute;left:50%;transform:translateX(-50%);margin:0;font-size:1.25rem;font-weight:bold;letter-spacing:-1px}
nav a{position:relative;color:#fff;text-decoration:none;margin-left:20px;font-size:.95rem;padding-bottom:4px}
nav a::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:2px;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
nav a:hover::after{transform:scaleX(1)}
.social-icons{display:flex;align-items:center;gap:24px;flex-shrink:0}
.social-icon{color:#fff;display:flex;align-items:center;transition:transform .2s ease,opacity .2s ease}
.social-icon:hover{opacity:.9;transform:translateY(-2px)}

/* ---------- Layout ---------- */
.page-container{width:min(1500px,96%);margin:45px auto 35px}
.page-heading{text-align:center;margin-bottom:25px}
.page-heading h2{font-size:2rem;margin:0;color:#fff;letter-spacing:-1px}
.page-heading p{color:#fff;margin:5px 0 0;font-size:.95rem}
.chat-container{width:100%;height:min(780px,calc(100vh - 230px));min-height:480px;display:flex;flex-direction:column;background:rgba(10,10,18,.7);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.18);border-radius:18px;box-shadow:0 8px 35px rgba(0,0,0,.35),0 0 25px rgba(0,180,255,.06);overflow:hidden}
.chat-header{padding:17px 25px;background:rgba(0,0,0,.45);border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between;gap:15px}
.header-title{display:flex;align-items:center;gap:14px}
.ai-icon{width:45px;height:45px;flex-shrink:0;border-radius:14px;background:linear-gradient(135deg,#4285f4,#a142f4,#e879f9);box-shadow:0 0 18px rgba(161,66,244,.35);color:#fff;display:grid;place-items:center;font-size:24px}
.header-title h2{margin:0;font-size:17px;color:#fff}
.status{color:#4ade80;font-size:12px;margin-top:2px}
.status.thinking{color:#facc15}
.status.error-status{color:#f87171}
#new-chat{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;cursor: pointer;transition:all .2s ease}
#new-chat:hover{background:rgba(56,189,248,.15);border-color:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,.2)}

/* ---------- Messages ---------- */
#chat-messages{flex:1;overflow-y:auto;padding:30px 35px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}
#chat-messages::-webkit-scrollbar{width:7px}
#chat-messages::-webkit-scrollbar-track{background:transparent}
#chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:10px}
.msg{max-width:85%;padding:15px 19px;border-radius:14px;font-size:14px;line-height:1.75;overflow-wrap:anywhere;animation:messageAppear .25s ease}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.11);border-bottom-left-radius:4px;max-width:90%}
.msg.user{align-self:flex-end;background:rgba(37,99,235,.35);border:1px solid rgba(59,130,246,.35);border-bottom-right-radius:4px;color:#fff}
.msg.error{background:rgba(127,29,29,.25);border:1px solid rgba(248,113,113,.3);color:#fca5a5}

/* ---------- Markdown ---------- */
.msg.bot h1,.msg.bot h2,.msg.bot h3,.msg.bot h4{color:#fff;line-height:1.3;margin:22px 0 10px}
.msg.bot h1{font-size:1.65rem}.msg.bot h2{font-size:1.4rem}.msg.bot h3{font-size:1.15rem}.msg.bot h4{font-size:1rem}
.msg.bot>:first-child{margin-top:0}
.msg.bot p{margin:10px 0}
.msg.bot p:last-child{margin-bottom:0}
.msg.bot strong{color:#fff;font-weight:700}
.msg.bot a:not(.citation-source):not(.source-card){color:#38bdf8;text-decoration:none;font-weight:600;transition:.2s ease}
.msg.bot a:not(.citation-source):not(.source-card):hover{color:#fff;text-shadow:0 0 10px rgba(56,189,248,.8)}
.msg.bot ul,.msg.bot ol{padding-left:25px;margin:12px 0}
.msg.bot li{margin:5px 0}
.msg.bot blockquote{margin:16px 0;padding:12px 18px;background:rgba(15,23,42,.35);border-radius:0 8px 8px 0;border-left:3px solid rgba(255,255,255,.8);color:#cbd5e1}
.msg.bot hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:20px 0}
.msg.bot table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.msg.bot th,.msg.bot td{border:1px solid rgba(255,255,255,.14);padding:9px 12px;text-align:left}
.msg.bot th{background:rgba(56,189,248,.15);color:#fff}
.msg.bot td{background:rgba(255,255,255,.025)}
.msg.bot code:not(pre code){background:rgba(255,255,255,.12);color:#7dd3fc;padding:2px 6px;border-radius:5px;font-family:Consolas,monospace;font-size:.9em}
.msg.bot pre{position:relative;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:18px;margin:14px 0;overflow-x:auto;font-size:13px;line-height:1.6}
.msg.bot pre code{font-family:Consolas,'Courier New',monospace;background:transparent;padding:0;color:#e4e4e7;white-space:pre}
.code-copy{position:absolute;top:9px;right:9px;padding:5px 10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#d4d4d8;font-size:11px;transition:.2s ease}
.code-copy:hover{background:rgba(56,189,248,.2);color:#fff;border-color:#38bdf8}

 
/* ---------- Image results gallery ---------- */

.image-gallery-section {
    width: 100%;
    margin: 0 0 20px;
    padding: 0 0 15px;
    border-bottom: 1px solid rgba(255,255,255,.13);
}

.image-gallery-heading {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 13px;
    color: #cbd5e1;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    text-transform: uppercase;
}

.image-gallery-icon {
    width: 25px;
    height: 25px;
    display: grid;
    place-items: center;
    border-radius: 7px;
    background: rgba(56,189,248,.13);
    color: #38bdf8;
    font-size: 16px;
}

.image-gallery-count {
    margin-left: auto;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(56,189,248,.12);
    color: #7dd3fc;
    font-size: 10px;
    font-weight: 600;
}

.image-gallery-track {
    display: flex;
    align-items: stretch;
    gap: 14px;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 3px 2px 12px;
    scroll-snap-type: x mandatory;
    scrollbar-width: thin;
    scrollbar-color: rgba(56,189,248,.4) transparent;
}

.image-gallery-track::-webkit-scrollbar {
    height: 6px;
}

.image-gallery-track::-webkit-scrollbar-track {
    background: transparent;
}

.image-gallery-track::-webkit-scrollbar-thumb {
    background: rgba(56,189,248,.35);
    border-radius: 10px;
}

.image-gallery-card {
    flex: 0 0 290px;
    min-width: 0;
    height: 220px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 12px;
    background: rgba(255,255,255,.035);
    scroll-snap-align: start;
    transition: border-color .2s ease, transform .2s ease;
}

.image-gallery-card:hover {
    border-color: rgba(56,189,248,.55);
    transform: translateY(-2px);
}

.image-gallery-image-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 5px;
    overflow: hidden;
    background: rgba(0,0,0,.22);
}

.image-gallery-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: transform .25s ease;
}

.image-gallery-card:hover .image-gallery-image {
    transform: scale(1.025);
}

@media (max-width: 768px) {
    .image-gallery-card {
        flex-basis: 245px;
        height: 190px;
    }
}

@media (max-width: 480px) {
    .image-gallery-card {
        flex-basis: 220px;
        height: 175px;
    }
}


/* ---------- Source list ---------- */
.sources-section{margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,.13)}
.sources-heading{display:flex;align-items:center;gap:9px;margin-bottom:12px;color:#cbd5e1;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.sources-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:7px;background:rgba(56,189,248,.13);color:#38bdf8;font-size:16px}
.sources-count{margin-left:auto;padding:3px 8px;border-radius:20px;background:rgba(56,189,248,.12);color:#7dd3fc;font-size:10px;font-weight:600}
.sources-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.source-card{min-width:0;display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.035);text-decoration:none;transition:all .2s ease}
.source-card:hover{background:rgba(56,189,248,.09);border-color:rgba(56,189,248,.4);transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,.15)}
.source-favicon{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;border-radius:8px;background:rgba(255,255,255,.08)}
.source-favicon img{width:20px;height:20px;object-fit:contain}
.source-info,.citation-source-info{min-width:0;display:flex;flex-direction:column;gap:2px}
.source-info{flex:1}
.source-title,.citation-source-name{color:#e4e4e7;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.source-domain,.citation-source-domain{color:#858595;font-size:10px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.source-external{color:#71717a;font-size:13px;flex-shrink:0;transition:color .2s ease}
.source-card:hover .source-external{color:#38bdf8}

/* ---------- Inline citation bubbles ---------- */
.source-citation{display:inline-block;position:relative;vertical-align:middle;margin:0 2px;font-size:.82em;line-height:1.4}
.source-citation summary{display:inline-flex;align-items:center;gap:7px;max-width:240px;padding:4px 9px;border:1px solid rgba(255,255,255,.13);border-radius:20px;background:rgba(255,255,255,.075);color:#e4e4e7;list-style:none;user-select:none;transition:background .2s ease,border-color .2s ease}
.source-citation summary::-webkit-details-marker{display:none}
.source-citation summary:hover,.source-citation[open] summary{background:rgba(56,189,248,.13);border-color:rgba(56,189,248,.45)}
.citation-favicon{width:15px;height:15px;object-fit:contain;flex-shrink:0;border-radius:3px}
.citation-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#dbeafe}
.citation-more{flex-shrink:0;color:#7dd3fc;font-size:.9em;font-weight:700}
.citation-list{position:absolute;left:0;top:calc(100% + 7px);z-index:50;width:min(320px,70vw);padding:7px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(12,15,25,.98);box-shadow:0 12px 35px rgba(0,0,0,.45)}
.citation-source{display:flex;align-items:center;gap:10px;padding:9px;border-radius:8px;color:#e4e4e7;text-decoration:none;transition:background .2s ease}
.citation-source:hover{background:rgba(56,189,248,.12)}
.citation-source img{width:20px;height:20px;flex-shrink:0;object-fit:contain;border-radius:4px}
.citation-source-arrow{margin-left:auto;color:#7dd3fc;flex-shrink:0}

/* ---------- Footer ---------- */
.chat-footer{padding:20px 25px;background:rgba(0,0,0,.35);border-top:1px solid rgba(255,255,255,.12)}
#chat-form{display:flex;align-items:center;gap:12px;max-width:1200px;margin:auto}
#chat-input{flex:1;min-width:0;padding:15px 18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:11px;outline:none;color:#fff;font-family:inherit;font-size:14px;transition:all .2s ease}
#chat-input::placeholder{color:#888899}
#chat-input:focus{border-color:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,.15);background:rgba(255,255,255,.11)}
#chat-send{border:1px solid rgba(56,189,248,.5);border-radius:10px;padding:14px 25px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;cursor: pointer;font-size:14px;transition:all .2s ease}
#chat-send:hover{background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 0 18px rgba(59,130,246,.35);transform:translateY(-1px)}
#chat-send:disabled{opacity:.5;transform:none;box-shadow:none;cursor:not-allowed}
.footer-note{color:#71717a;text-align:center;font-size:11px;margin-top:13px}
#notice-link{text-decoration:underline}

/* ---------- Custom cursor ---------- */
@media (hover:hover) and (pointer:fine){
  html,html *,body,body *,body *::before,body *::after{cursor:none!important}
  .cursor-dot,.cursor-ring{position:fixed;top:0;left:0;border-radius:50%;pointer-events:none;z-index:100001;transform:translate(-50%,-50%)}
  .cursor-dot{width:6px;height:6px;background:#00f3ff;box-shadow:0 0 8px #00f3ff}
  .cursor-ring{width:14px;height:14px;border:2px solid rgba(0,243,255,.8);box-shadow:0 0 12px rgba(0,243,255,.4);transition:width .2s ease,height .2s ease,border-color .2s ease}
  .cursor-ring.hover{width:12px;height:12px;border-color:#8af9ff;box-shadow:0 0 16px rgba(138,249,255,.6)}
  .cursor-dot.hover{background:#8af9ff;box-shadow:0 0 8px #8af9ff}
  .cursor-ring.click{width:8px;height:8px}
}
@media (hover:none),(pointer:coarse){.cursor-dot,.cursor-ring{display:none}}

/* ---------- Responsive ---------- */
@media (max-width:900px){#chat-messages{padding:22px}.msg{max-width:94%}.chat-container{height:calc(100vh - 220px)}}
@media (max-width:768px){
  header{background:#000;flex-direction:column;text-align:center;padding:16px 20px}
  header::before{display:none}
  /* only the FIRST div (title + nav); the old "header div" rule also hit .social-icons */
  header>div:first-child{display:flex;flex-direction:column;align-items:center}
  header h1{position:static;transform:none;margin:0 0 12px;font-size:1.4rem;line-height:1.2}
  header nav{display:flex;justify-content:center;gap:12px;margin:0!important}
  header nav a{margin:0!important}
  .social-icons{margin-top:12px}
  .page-container{width:100%;margin:25px auto 0;padding:0 10px}
  .page-heading h2{font-size:1.6rem}
  .chat-container{height:calc(100vh - 190px);min-height:400px;border-radius:12px}
  .chat-header{padding:13px 15px}
  #chat-messages{padding:17px 12px;gap:14px}
  .msg{max-width:96%;padding:12px 14px;font-size:13px}
  .chat-footer{padding:14px 12px}
  #chat-input{padding:13px 12px;font-size:13px}
  #chat-send{padding:13px 16px}
  .msg.bot table{display:block;overflow-x:auto}
  .sources-grid{grid-template-columns:1fr}
}
@media (max-width:400px){.header-title{gap:8px}.ai-icon{width:38px;height:38px}#new-chat{padding:9px 10px;font-size:11px}header nav a{font-size:.85rem}}
@media (prefers-reduced-motion:reduce){.popup-header::before,header::before{animation:none}.popup-overlay,.notification-popup,.popup-close,.popup-confirm{transition:none}}

/* =====================================================================
   PASTE this at the very END of your <style> block (after the responsive
   and reduced-motion rules) so it overrides the earlier gallery rules.
===================================================================== */

/* ---------- Layout bits ---------- */
.chat-container{position:relative}
#chat-messages{scroll-behavior:auto}          /* smooth scrolling fights with streaming */
.header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* ---------- Custom cursor: real cursor hidden ONLY while body.custom-cursor ---------- */
body:not(.custom-cursor),body:not(.custom-cursor) *{cursor:auto!important}
@media (hover:hover) and (pointer:fine){
  body.custom-cursor,body.custom-cursor *,body.custom-cursor *::before,body.custom-cursor *::after{cursor:none!important}
}
/* the custom cursor only shows when the real one is not (see JS: scrollbars, window edge, before first move) */
.cursor-dot,.cursor-ring{opacity:0;transition:opacity .12s ease}
.cursor-ring{transition:opacity .12s ease,width .2s ease,height .2s ease,border-color .2s ease}
body.custom-cursor.cursor-visible .cursor-dot,body.custom-cursor.cursor-visible .cursor-ring{opacity:1}
body:not(.custom-cursor) .cursor-dot,body:not(.custom-cursor) .cursor-ring{display:none!important}

/* ---------- Setting row inside the Notice popup ---------- */
.popup-setting{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);color:#d4d4d8;font-size:.9rem}
.popup-setting input{width:16px;height:16px;accent-color:#00d9ff}
@media (hover:none),(pointer:coarse){.popup-setting{display:none}}

/* ---------- Textarea input + Stop button ---------- */
#chat-form{align-items:flex-end}
#chat-input{resize:none;max-height:200px;line-height:1.5;overflow-y:auto;display:block}
#chat-input{color-scheme:dark;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
#chat-input::-webkit-scrollbar{width:6px}
#chat-input::-webkit-scrollbar-track{background:transparent;margin:6px 0}
#chat-input::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:10px}
#chat-input::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.5)}
#chat-input::-webkit-scrollbar-corner{background:transparent}
#chat-send{min-width:92px;height:50px}
#chat-send.stop{background:linear-gradient(135deg,#dc2626,#b91c1c);border-color:rgba(248,113,113,.6)}
#chat-send.stop:hover{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 0 18px rgba(239,68,68,.35)}

/* ---------- Streaming ---------- */
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.pending-text{color:#a1a1aa;font-style:italic}
.pending-text::after{content:"";animation:dots 1.2s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.answer-content.streaming>:last-child::after{content:"▍";margin-left:2px;color:#7dd3fc;animation:caret 1s steps(1) infinite}
.answer-content.streaming>pre:last-child::after{content:none}

/* ---------- Copy / Regenerate bar ---------- */
.msg-actions{display:flex;gap:4px;margin-top:12px}
.msg-action{width:26px;height:26px;padding:0;display:inline-grid;place-items:center;background:transparent;border:1px solid transparent;border-radius:6px;color:#8b8b9a;transition:color .15s ease,background .15s ease}
.msg-action:hover{background:rgba(255,255,255,.1);color:#fff}
.msg-action.ok{color:#4ade80}
.msg-action.regen{display:none}
.msg.bot:last-child .msg-action.regen{display:inline-grid}
.msg-note{margin-top:12px;color:#a1a1aa;font-size:12px;font-style:italic}

/* ---------- BIGGER IMAGE GALLERY ----------
   Cards are taller and each one takes the width of its image (natural aspect
   ratio, slightly cropped if extremely wide), so there is no empty padding. */
.image-gallery-track{gap:10px}
.image-gallery-card{flex:0 0 auto;width:auto;min-width:150px;height:270px;border-radius:12px;background:rgba(255,255,255,.06)}
.image-gallery-image-link{display:block;width:auto;height:100%;padding:0;background:none}
.image-gallery-image{width:auto;height:100%;min-width:150px;max-width:min(480px,80vw);object-fit:cover}
.image-gallery-card:hover .image-gallery-image{transform:scale(1.03)}
@media (max-width:768px){.image-gallery-card{flex:0 0 auto;height:220px}}
@media (max-width:480px){.image-gallery-card{flex:0 0 auto;height:190px}}


/* =====================================================================
   v3 ADDITIONS
===================================================================== */

/* ---------- Letter-by-letter fade (FADE_MS in the script = 320) ---------- */
@keyframes fi{from{opacity:0}to{opacity:1}}
.fi{animation:fi .32s ease-out both}

/* ---------- Whole-message fade: gallery, sources, actions, notes ---------- */
@keyframes blockFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.image-gallery-section,.sources-section,.msg-actions,.msg-note,.pending-text{animation:blockFade .6s ease backwards}
.image-gallery-card{animation:blockFade .55s ease backwards}
.image-gallery-card:nth-child(2){animation-delay:.06s}
.image-gallery-card:nth-child(3){animation-delay:.12s}
.image-gallery-card:nth-child(4){animation-delay:.18s}
.image-gallery-card:nth-child(5){animation-delay:.24s}
.image-gallery-card:nth-child(n+6){animation-delay:.3s}
.msg.restored *{animation:none!important}          /* restored chats appear instantly */
.msg-text{white-space:pre-wrap}
.msg.user>.msg-text:not(:first-child){margin-top:2px}

/* ---------- "Latest" pill: fades, slides, has its own tiny x ---------- */
.jump-pill{position:absolute;left:50%;bottom:104px;z-index:5;display:flex;align-items:center;border-radius:20px;border:1px solid rgba(56,189,248,.5);background:rgba(15,23,42,.92);box-shadow:0 4px 18px rgba(0,0,0,.4);opacity:0;visibility:hidden;transform:translate(-50%,10px);transition:opacity .28s ease,transform .28s ease,visibility 0s linear .28s}
.jump-pill.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s}
.jump-main{padding:8px 6px 8px 16px;background:none;border:0;color:#e0f2fe;font-family:inherit;font-size:12px;font-weight:600;transition:color .15s}
.jump-main:hover{color:#fff}
.jump-close{width:16px;height:16px;margin:0 9px 0 2px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#7dd3fc;font-family:inherit;font-size:12px;line-height:1;transition:background .15s,color .15s}
.jump-close:hover{background:rgba(255,255,255,.18);color:#fff}

/* ---------- Image attachments ---------- */
.attach-btn{flex-shrink:0;width:50px;height:50px;display:grid;place-items:center;border-radius:11px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#cbd5e1;transition:all .2s ease}
.attach-btn:hover{background:rgba(56,189,248,.15);border-color:#38bdf8;color:#fff}
.attach-preview{display:none;max-width:1200px;margin:0 auto 10px;gap:10px;flex-wrap:wrap}
.attach-preview.has-items{display:flex}
.attach-thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.2);animation:blockFade .3s ease backwards}
.attach-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.attach-remove{position:absolute;top:3px;right:3px;width:18px;height:18px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:12px;line-height:1;transition:background .15s}
.attach-remove:hover{background:rgba(220,38,38,.9)}
.msg-images{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.msg-images img{max-height:140px;max-width:100%;border-radius:10px;display:block}
.msg-image-missing{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.1);font-size:12px;color:#cbd5e1}
.chat-container.dragging::after{content:"Drop images to attach";position:absolute;inset:0;z-index:20;display:grid;place-items:center;border:2px dashed #38bdf8;border-radius:18px;background:rgba(0,0,0,.6);color:#e0f2fe;font-weight:600;pointer-events:none}
img{-webkit-user-drag:none}

/* ---------- Saved chats panel ---------- */
#chats-btn{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:10px 14px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;transition:all .2s ease}
#chats-btn:hover{background:rgba(56,189,248,.15);border-color:#38bdf8}
.chats-panel{position:absolute;top:72px;right:20px;z-index:30;width:min(320px,calc(100% - 40px));padding:8px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(12,15,25,.98);box-shadow:0 12px 35px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s ease,transform .2s ease,visibility 0s linear .2s}
.chats-panel.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.chat-row{display:flex;align-items:center;border-radius:9px;transition:background .15s}
.chat-row:hover{background:rgba(255,255,255,.07)}
.chat-row.active{background:rgba(56,189,248,.14)}
.chat-open{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:9px 10px;border:0;background:none;color:#e4e4e7;font-family:inherit;text-align:left}
.chat-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-time{font-size:11px;color:#858595}
.chat-delete{width:24px;height:24px;margin-right:6px;padding:0;border:0;border-radius:50%;background:transparent;color:#8b8b9a;font-size:15px;line-height:1;transition:background .15s,color .15s}
.chat-delete:hover{background:rgba(248,113,113,.2);color:#fca5a5}
.chats-empty,.chats-hint{padding:8px 10px;font-size:11px;color:#858595}

/* ---------- Custom cursor ON: also hide scrollbars, because the browser always draws its own
   arrow over them. Wheel / touchpad / keyboard scrolling still work. ---------- */
@media (hover:hover) and (pointer:fine){
  html.custom-cursor,html.custom-cursor *{scrollbar-width:none!important}
  html.custom-cursor::-webkit-scrollbar,html.custom-cursor ::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
}

/* ---------- Smoother small things ---------- */
.msg-action,.code-copy,#new-chat,#chat-send,#chat-input,.source-card{transition-duration:.2s}

@media (prefers-reduced-motion:reduce){
  .fi,.image-gallery-section,.image-gallery-card,.sources-section,.msg-actions,.msg-note,.pending-text,.attach-thumb{animation:none!important}
  .jump-pill,.chats-panel{transition:none}
}

<script>
/* =========================================
   CONFIG
========================================= */
const WORKER_URL = "https://gemini-chat.mappinggerman04.workers.dev";
const MAX_HISTORY_MESSAGES = 40;

const NOTICE_TEXT =
"· If you got an error about exceeding your current quota, this means that too many students used it and my API limit has been reached. Sorry, there is nothing I can do about this unless I pay money. My limit resets tomorrow.\n" +
"· Gemini can make mistakes. Please, double check your work.\n" +
"· Google can use data you enter for training their models. Avoid entering sensitive information.\n" +
"· I am not responsible if your teacher catches you using AI in class, and any punishments they may give if you get caught.\n\n" +
"Coded by Mohamed Abdalrahman, credit to Google for Gemini API."; 

const chatForm = document.getElementById("chat-form");
const chatInput = document.getElementById("chat-input");
const chatMessages = document.getElementById("chat-messages");
const chatSend = document.getElementById("chat-send");
const newChat = document.getElementById("new-chat");
const statusEl = document.getElementById("status");

/* =========================================
   SMALL HELPERS
========================================= */
function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function faviconURL(domain) {
    return "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(domain) + "&sz=64";
}

function makeFavicon(domain, className) {
    const img = el("img", className);
    img.alt = "";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.src = faviconURL(domain);
    img.addEventListener("error", () => { img.style.display = "none"; });
    return img;
}

/* Validate one source from the worker ({title, url}) */
function cleanSource(source) {
    if (!source || typeof source.url !== "string") return null;
    let url;
    try { url = new URL(source.url); } catch { return null; }
    if (url.protocol !== "https:") return null;
    return {
        title: typeof source.title === "string" && source.title.trim() ? source.title.trim() : url.hostname,
        url: url.href,
        domain: url.hostname.replace(/^www\./, "")
    };
}

/* =========================================
   INLINE CITATION BUBBLES
   The worker tells Gemini to write [Source 1], [Source 1, Source 3] ...
   Source N maps to sources[N - 1].
========================================= */
const CITATION_SOURCE = String.raw`\[\s*Sources?\s+(\d+(?:\s*(?:,|and|&)\s*(?:Sources?\s+)?\d+)*)\s*\]`;
const CITATION_TEST = new RegExp(CITATION_SOURCE, "i");

function createCitationBubble(numbers, sources) {

    const matched = [];

    for (const n of numbers) {
        const source = cleanSource(sources[n - 1]);
        if (source && !matched.some(m => m.url === source.url)) matched.push(source);
    }

    if (!matched.length) return null;

    const details = el("details", "source-citation");
    const summary = el("summary");

    summary.append(makeFavicon(matched[0].domain, "citation-favicon"), el("span", "citation-title", matched[0].domain));

    if (matched.length > 1) {
        summary.appendChild(el("span", "citation-more", "+" + (matched.length - 1)));
    }

    const list = el("div", "citation-list");

    for (const source of matched) {
        const link = el("a", "citation-source");
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const info = el("div", "citation-source-info");
        info.append(el("span", "citation-source-name", source.title), el("span", "citation-source-domain", source.domain));

        link.append(makeFavicon(source.domain), info, el("span", "citation-source-arrow", "↗"));
        list.appendChild(link);
    }

    details.append(summary, list);
    return details;
}

function renderCitations(container, sources) {

    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
            const parent = node.parentElement;
            if (!parent || parent.closest("pre, code, a, script, style, .katex")) return NodeFilter.FILTER_REJECT;
            return CITATION_TEST.test(node.textContent) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        }
    });

    const textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);

    for (const node of textNodes) {

        const text = node.textContent;
        const fragment = document.createDocumentFragment();
        let lastIndex = 0;

        for (const match of text.matchAll(new RegExp(CITATION_SOURCE, "gi"))) {

            fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));

            const numbers = match[1].match(/\d+/g).map(Number);
            const bubble = sources.length ? createCitationBubble(numbers, sources) : null;

            // No matching source: drop the marker instead of showing "[Source 7]" as raw text
            if (bubble) fragment.appendChild(bubble);

            lastIndex = match.index + match[0].length;
        }

        fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
        node.parentNode.replaceChild(fragment, node);
    }
}

/* Dropdown behaviour: one open at a time, close on outside click, keep inside the chat */
chatMessages.addEventListener("toggle", (event) => {

    const details = event.target;
    if (!details.matches || !details.matches("details.source-citation") || !details.open) return;

    document.querySelectorAll("details.source-citation[open]").forEach(d => { if (d !== details) d.open = false; });

    const list = details.querySelector(".citation-list");
    list.style.left = "0";
    list.style.right = "auto";

    const listBox = list.getBoundingClientRect();
    const boundary = chatMessages.getBoundingClientRect();

    if (listBox.right > boundary.right - 8) {
        list.style.left = "auto";
        list.style.right = "0";
    }
}, true);

document.addEventListener("click", (event) => {
    document.querySelectorAll("details.source-citation[open]").forEach(d => {
        if (!d.contains(event.target)) d.open = false;
    });
});

/* =========================================
   MATHEMATICAL EXPRESSION PROTECTION
========================================= */

// Protect math delimiters from Marked.
// Marked can interpret backslashes before punctuation as Markdown escapes.
// We temporarily replace math expressions with plain-text tokens, parse the
// Markdown, and restore the original expressions before running KaTeX.

function protectMathForMarkdown(text) {
    const expressions = [];

    const protectedText = text.replace(
        /(\$\$[\s\S]+?\$\$|(?<!\\)\$(?!\$|\s)(?:\\\$|[^\n$])+?(?<!\\|\s)\$(?!\$|\d)|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\))/g,
        (match) => {
            const token = `MATHPROTECTEDTOKEN${expressions.length}END`;
            expressions.push(match);
            return token;
        }
    );

    return {
        text: protectedText,
        expressions
    };
}



// Restore protected expressions inside the parsed HTML.
// This operates on text nodes, not HTML, so it cannot inject markup.

function restoreMathInHTML(container, expressions) {
    if (!expressions.length) return;

    const walker = document.createTreeWalker(
        container,
        NodeFilter.SHOW_TEXT
    );

    const nodes = [];

    while (walker.nextNode()) {
        if (walker.currentNode.textContent.includes("MATHPROTECTEDTOKEN")) {
            nodes.push(walker.currentNode);
        }
    }

    for (const node of nodes) {
        let text = node.textContent;

        text = text.replace(
            /MATHPROTECTEDTOKEN(\d+)END/g,
            (match, index) => {
                return expressions[Number(index)] ?? match;
            }
        );

        node.textContent = text;
    }
}


/* =========================================
   MARKDOWN RENDERING
========================================= */

function normalizeMathDelimiters(text) {
    if (typeof text !== "string") return text;

    // 1. Convert multiline square-bracket math into display math.
    text = text.replace(
        /(^|\n)([ \t]*)\[(?!\\)[ \t]*\n([\s\S]*?)\n[ \t]*\]([ \t]*)(?=\n|$)/g,
        (match, newline, leading, math) => {
            return `${newline}${leading}\\[\n${math.trim()}\n\\]`;
        }
    );

    // 2. Convert single-line square-bracket math into display math.
    text = text.replace(
        /(^|\n)([ \t]*)\[(?!\\)([^\[\]\n]+)\]([ \t]*)(?=\n|$)/g,
        (match, newline, leading, math) => {
            return `${newline}${leading}\\[${math.trim()}\\]`;
        }
    );

    return text;
}


  
function renderMarkdown(text, sources = []) {

    // First, repair math formatting from Gemini.
    text = normalizeMathDelimiters(text);

    // Second, protect math before Markdown parsing.
    const protectedMath = protectMathForMarkdown(text);

    // Third, parse and sanitize Markdown.
    const cleanHTML = DOMPurify.sanitize(
        marked.parse(protectedMath.text)
    );

    const container = document.createElement("div");
    container.innerHTML = cleanHTML;

    // Fourth, restore the original mathematical delimiters.
    restoreMathInHTML(container, protectedMath.expressions);

    container.querySelectorAll("a[href]").forEach(a => {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
    });

    // Fifth, render mathematical expressions with KaTeX.
    if (window.renderMathInElement) {

        renderMathInElement(container, {
            delimiters: [
    { left: "$$", right: "$$", display: true },
    { left: "\\[", right: "\\]", display: true },
    { left: "\\(", right: "\\)", display: false },
    { left: "$", right: "$", display: false }
],

            throwOnError: false,
            strict: "ignore",

            ignoredTags: [
                "script",
                "noscript",
                "style",
                "textarea",
                "pre",
                "code"
            ]
        });

    } else {
        console.error("KaTeX auto-render is not available.");
    }

    // Finally, render source citations.
    renderCitations(
        container,
        Array.isArray(sources) ? sources : []
    );

    return container.innerHTML;
}

function formatCodeBlocks(container) {

    container.querySelectorAll("pre code").forEach(code => {

        if (window.hljs) hljs.highlightElement(code);

        const pre = code.parentElement;
        if (pre.querySelector(".code-copy")) return;

        const button = el("button", "code-copy", "Copy code");
        button.type = "button";

        button.addEventListener("click", async () => {
            try {

                button.textContent = "Copied!";
            } catch (error) {
                button.textContent = "Copy failed";
                console.error(error);
            }
            setTimeout(() => { button.textContent = "Copy code"; }, 1500);
        });

        pre.appendChild(button);
    });
}

// Validate image data received from the Worker.

function cleanImage(image) {

    if (!image || typeof image !== "object") return null;

    let thumbnailURL;
    let pageURL;

    try {
        thumbnailURL = new URL(image.thumbnailUrl);
        pageURL = new URL(image.pageUrl);
    } catch {
        return null;
    }

    // Allow HTTPS images from Google Images result providers.
    // Do not allow insecure HTTP URLs.
    if (thumbnailURL.protocol !== "https:") {
        return null;
    }

    if (pageURL.protocol !== "https:") {
        return null;
    }

    let licenseURL = null;

    if (typeof image.licenseUrl === "string") {
        try {
            const parsed = new URL(image.licenseUrl);

            if (parsed.protocol === "https:") {
                licenseURL = parsed.href;
            }
        } catch {
            // License link is optional.
        }
    }

    return {
        title: typeof image.title === "string"
            ? image.title.slice(0, 180)
            : "Untitled image",

        thumbnailUrl: thumbnailURL.href,
        pageUrl: pageURL.href,

        license: typeof image.license === "string"
            ? image.license.slice(0, 100)
            : "See source page",

        licenseUrl: licenseURL,

        artist: typeof image.artist === "string"
            ? image.artist.slice(0, 250)
            : ""
    };
}


// Construct the image gallery using DOM methods.
// Text is inserted with textContent rather than innerHTML.

function addImageGallery(container, images) {

    if (!Array.isArray(images)) return;

    const validImages = [];
    const seen = new Set();

    for (const raw of images) {

        const image = cleanImage(raw);

        if (!image || seen.has(image.pageUrl)) continue;

        seen.add(image.pageUrl);
        validImages.push(image);
    }

    if (validImages.length === 0) {
        console.warn("Image search returned no valid images.", images);
        return;
    }

    const section = el("section", "image-gallery-section");

    const heading = el("div", "image-gallery-heading");

    heading.append(
        el("span", "image-gallery-icon", "▧"),
        el("span", "", "Images"),
        el(
            "span",
            "image-gallery-count",
            `${validImages.length} ${validImages.length === 1 ? "image" : "images"}`
        )
    );

    const track = el("div", "image-gallery-track");

    for (const image of validImages) {

        const card = el("article", "image-gallery-card");

        // Clicking an image opens its original Wikimedia Commons page.
        const imageLink = el("a", "image-gallery-image-link");

        imageLink.href = image.pageUrl;
        imageLink.target = "_blank";
        imageLink.rel = "noopener noreferrer";
        imageLink.setAttribute("aria-label", "Open original image");

        const img = el("img", "image-gallery-image");

        img.src = image.thumbnailUrl;
        img.alt = image.title || "Image search result";
        img.loading = "lazy";
        img.decoding = "async";
        img.referrerPolicy = "no-referrer";

        img.addEventListener("error", () => {
            card.style.display = "none";
        });

        imageLink.appendChild(img);
        card.appendChild(imageLink);
        track.appendChild(card);
    }

    if (!track.children.length) return;

    section.append(heading, track);

    // Display the image gallery before the generated answer.
    container.insertBefore(section, container.firstChild);
}

/* =========================================
   CONSTANTS + STATE
========================================= */
const STORE_KEY = "gemini-chats-v2";
const LEGACY_KEY = "gemini-chat-v1";
const MAX_CHATS = 5;
const MAX_IMAGES = 4;                 // per message (the worker enforces the same limit)
const FADE_MS = 320;                  // must match the .fi animation duration in the CSS
const DEFAULT_IMAGE_PROMPT = "Please analyze the attached image(s).";
const CITATION_STRIP = /\s*\[\s*Sources?\s+\d+(?:\s*(?:,|and|&)\s*(?:Sources?\s+)?\d+)*\s*\]/gi;
const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

const SVG_ATTRS = 'width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const ICON_COPY  = `<svg ${SVG_ATTRS}><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>`;
const ICON_CHECK = `<svg ${SVG_ATTRS}><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const ICON_REGEN = `<svg ${SVG_ATTRS}><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>`;
const ICON_CLIP  = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>`;

let store = { activeId: null, chats: [] };   // saved chats (max 5)
let records = [];                             // messages of the ACTIVE chat
let pendingImages = [];                       // attached, not yet sent
let busy = false;
let abortController = null;
let genToken = 0;                             // bumps whenever a running generation must be ignored

const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));

/* =========================================
   REQUEST BODY
   Images are sent only for the most recent message that has them (keeps requests small
   and quota use low). Older images are replaced by a short note.
========================================= */
function toContents() {
    const recent = records.slice(-MAX_HISTORY_MESSAGES);

    let lastImageIndex = -1;
    recent.forEach((r, i) => {
        if (r.role === "user" && r.attachments?.some(a => a.data)) lastImageIndex = i;
    });

    return recent.map((r, i) => {
        const parts = [];
        let text = r.text || "";
        const attachments = r.attachments || [];

        if (attachments.length) {
            if (i === lastImageIndex) {
                for (const a of attachments) {
                    if (a.data) parts.push({ inlineData: { mimeType: a.mime, data: a.data } });
                }
            } else {
                text += `\n[${attachments.length} image(s) were attached here but are no longer available.]`;
            }
        }

        if (!text.trim()) text = DEFAULT_IMAGE_PROMPT;
        parts.push({ text });                       // images first, then text
        return { role: r.role, parts };
    });
}

/* =========================================
   SAVED CHATS (up to 5, in localStorage)
========================================= */
function chatTitle(recs) {
    const first = recs.find(r => r.role === "user");
    const text = (first?.text || "").trim() || (first?.attachments?.length ? "Image chat" : "New chat");
    return text.length > 40 ? text.slice(0, 40) + "…" : text;
}

// Full image data is never stored (too big); only small thumbnails.
function persistable(recs) {
    return recs.slice(-MAX_HISTORY_MESSAGES).map(r => ({
        role: r.role,
        text: r.text,
        sources: r.sources,
        images: r.images,
        attachments: (r.attachments || []).map(a => ({ mime: a.mime, thumb: a.thumb }))
    }));
}

function readStore() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
        if (saved && Array.isArray(saved.chats)) {
            return {
                activeId: saved.activeId || null,
                chats: saved.chats.filter(c => c && c.id && Array.isArray(c.records))
            };
        }
        const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || "[]");   // old single-chat format
        if (Array.isArray(legacy) && legacy.length) {
            return { activeId: null, chats: [{ id: newId(), title: chatTitle(legacy), updated: Date.now(), records: legacy }] };
        }
    } catch { /* corrupted: start fresh */ }
    return { activeId: null, chats: [] };
}

function writeStore() {
    for (let attempt = 0; attempt <= MAX_CHATS; attempt++) {
        try {
            localStorage.setItem(STORE_KEY, JSON.stringify(store));
            return;
        } catch {
            // storage full: drop thumbnails from the oldest chat that still has some
            const victim = [...store.chats].reverse().find(c => c.records.some(r => r.attachments?.some(a => a.thumb)));
            if (!victim) return;
            for (const r of victim.records) {
                if (r.attachments) r.attachments = r.attachments.map(a => ({ mime: a.mime }));
            }
        }
    }
}

function saveChat() {
    if (records.length) {
        const data = { id: store.activeId, title: chatTitle(records), updated: Date.now(), records: persistable(records) };
        const existing = store.chats.find(c => c.id === store.activeId);

        if (existing) Object.assign(existing, data);
        else store.chats.push(data);

        store.chats.sort((a, b) => b.updated - a.updated);
        store.chats = store.chats.slice(0, MAX_CHATS);        // the oldest chat falls off
    } else {
        store.chats = store.chats.filter(c => c.id !== store.activeId);   // nothing left to save
    }
    writeStore();
    renderChatPanel();
}

let stickToBottom = true;

let followIntent = true;     // we want to end up at the bottom
let jumpDismissed = false;

function updateJump() {
    const dist = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
    stickToBottom = dist < 80;

    if (stickToBottom) jumpDismissed = false;
    if (autoScrolling && dist < 3) autoScrolling = false;

    jumpPill.style.bottom = (document.querySelector(".chat-footer").offsetHeight + 14) + "px";
    jumpPill.classList.toggle("show", !stickToBottom && !jumpDismissed && !autoScrolling);
}

function scrollToBottom(force = false, smooth = false) {
    if (!force && (!stickToBottom || autoScrolling)) return;

    followIntent = true;

    if (smooth) {
        autoScrolling = true;
        jumpPill.classList.remove("show");
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: "smooth" });

        setTimeout(() => {
            autoScrolling = false;
            if (followIntent) chatMessages.scrollTop = chatMessages.scrollHeight;   // catch up with streamed text
            updateJump();
        }, 900);
    } else {
        chatMessages.scrollTop = chatMessages.scrollHeight;
        stickToBottom = true;
    }
}

// The user took control: stop auto-following.

function loadViaImg(file) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Unreadable image")); };
        img.src = url;
    });
}

const loadBitmap = (file) =>
    window.createImageBitmap ? createImageBitmap(file).catch(() => loadViaImg(file)) : loadViaImg(file);

// Resize to max 1280px and re-encode as JPEG so uploads stay small and uniform.
async function processImage(file) {
    const bitmap = await loadBitmap(file);
    const bw = bitmap.naturalWidth || bitmap.width;
    const bh = bitmap.naturalHeight || bitmap.height;
    const scale = Math.min(1, 1280 / Math.max(bw, bh));

    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bw * scale));
    canvas.height = Math.max(1, Math.round(bh * scale));

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";                              // transparent PNGs become white, not black
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close?.();

    let data = "";
    for (const quality of [0.85, 0.7, 0.55]) {
        data = canvas.toDataURL("image/jpeg", quality).split(",")[1];
        if (data.length < 1800000) break;                // worker limit is 2,000,000 characters
    }

    const ts = Math.min(1, 240 / Math.max(canvas.width, canvas.height));
    const thumb = document.createElement("canvas");
    thumb.width = Math.max(1, Math.round(canvas.width * ts));
    thumb.height = Math.max(1, Math.round(canvas.height * ts));
    thumb.getContext("2d").drawImage(canvas, 0, 0, thumb.width, thumb.height);

    return { mime: "image/jpeg", data, thumb: thumb.toDataURL("image/jpeg", 0.6) };
}

async function addFiles(fileList) {
    const files = [...fileList].filter(f => f.type.startsWith("image/"));
    if (!files.length) return;

    const room = MAX_IMAGES - pendingImages.length;
    if (files.length > room) flashStatus(`You can attach up to ${MAX_IMAGES} images per message.`);

    for (const file of files.slice(0, Math.max(room, 0))) {
        try {
            pendingImages.push(await processImage(file));
            renderPending();
        } catch {
            flashStatus("Couldn't read that image (try JPG, PNG or WebP).");
        }
    }
}

function renderPending() {
    previewStrip.replaceChildren();
    previewStrip.classList.toggle("has-items", pendingImages.length > 0);

    pendingImages.forEach((img, index) => {
        const box = el("div", "attach-thumb");
        const thumb = el("img");
        thumb.src = img.thumb;
        thumb.alt = "Attached image";

        const remove = el("button", "attach-remove", "×");
        remove.type = "button";
        remove.setAttribute("aria-label", "Remove image");
        remove.addEventListener("click", () => { pendingImages.splice(index, 1); renderPending(); });

        box.append(thumb, remove);
        previewStrip.appendChild(box);
    });
    updateJump();
}

        }
        bubble.appendChild(row);
    }

    if (rec.text) bubble.appendChild(el("div", "msg-text", rec.text));
    if (!restored) scrollToBottom(true, true);
    return bubble;
}

function addNotice(text) {
    const bubble = createBubble("bot");
    bubble.innerHTML = renderMarkdown(text);
    return bubble;
}

// Final render of an answer. While streaming (animate = true) the gallery that already
// faded in is KEPT, so it does not flash; sources and action buttons then fade in.
function fillBotBubble(bubble, rec, animate = false) {
    const gallery = animate ? bubble.querySelector(".image-gallery-section") : null;
    [...bubble.children].forEach(child => { if (child !== gallery) child.remove(); });

    if (!gallery) addImageGallery(bubble, rec.images);

    const answer = el("div", "answer-content");
    answer.innerHTML = renderMarkdown(rec.text, rec.sources || []);
    bubble.appendChild(answer);

    formatCodeBlocks(answer);
    addSources(bubble, rec.sources);
    addActions(bubble, rec);
}

function addActions(bubble, rec) {
    bubble.querySelector(".msg-actions")?.remove();

    const bar = el("div", "msg-actions");

    const copy = el("button", "msg-action");
    copy.type = "button";
    copy.title = "Copy";
    copy.setAttribute("aria-label", "Copy answer");
    copy.innerHTML = ICON_COPY;
    copy.addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(rec.text.replace(CITATION_STRIP, ""));
            copy.innerHTML = ICON_CHECK;
            copy.classList.add("ok");
        } catch {
            copy.title = "Copy failed";
        }
        setTimeout(() => { copy.innerHTML = ICON_COPY; copy.classList.remove("ok"); copy.title = "Copy"; }, 1500);
    });

    const regen = el("button", "msg-action regen");
    regen.type = "button";
    regen.title = "Regenerate";
    regen.setAttribute("aria-label", "Regenerate answer");
    regen.innerHTML = ICON_REGEN;
    regen.addEventListener("click", regenerate);

    bar.append(copy, regen);
    bubble.appendChild(bar);
}

function renderConversation() {
    chatMessages.replaceChildren();

    for (const rec of records) {
        if (rec.role === "user") {
            addUserMessage(rec, true);
        } else {
            const bubble = createBubble("bot");
            bubble.classList.add("restored");          // no fade-in animations for restored chats
            fillBotBubble(bubble, rec);
        }
    }
    followIntent = true;
    chatMessages.scrollTop = chatMessages.scrollHeight;
    stickToBottom = true;
    updateJump();
}

/* =========================================
   LETTER-BY-LETTER FADE
   Every render replaces the answer's HTML, so each recently revealed character is
   wrapped in a <span class="fi"> whose animation-delay is set to minus its age: the fade
   carries on seamlessly across renders instead of restarting.
========================================= */
function createFader() {
    let log = [];          // { from, to, t0, t1 }: characters first rendered between t0 and t1
    let lastTotal = 0;
    let lastTime = 0;

    return function applyFade(root, now) {

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode(node) {
                const parent = node.parentElement;
                if (!parent || !node.nodeValue || parent.closest("details, .katex, svg, script, style")) {
                    return NodeFilter.FILTER_REJECT;
                }
                return NodeFilter.FILTER_ACCEPT;
            }
        });

        const nodes = [];
        let total = 0;
        while (walker.nextNode()) {
            nodes.push([walker.currentNode, total]);
            total += walker.currentNode.nodeValue.length;
        }

        if (total > lastTotal) {
            log.push({ from: lastTotal, to: total, t0: lastTime || now, t1: now });
        } else if (total < lastTotal) {                      // markdown reflowed: clip the log
            log = log.map(c => ({ ...c, to: Math.min(c.to, total) })).filter(c => c.to > c.from);
        }
        lastTotal = total;
        lastTime = now;
        log = log.filter(c => now - c.t1 < FADE_MS);

        if (!log.length) return;

        // Characters are spread evenly over the time between two renders (true letter by letter).
        const ageOf = (i) => {
            for (const c of log) {
                if (i >= c.from && i < c.to) {
                    const f = (i - c.from + 1) / (c.to - c.from);
                    return now - (c.t0 + f * (c.t1 - c.t0));
                }
            }
            return Infinity;
        };

        const firstFading = log[0].from;

        for (const [node, start] of nodes) {
            const text = node.nodeValue;
            if (start + text.length <= firstFading) continue;

            let k = 0;
            while (k < text.length && !(ageOf(start + k) < FADE_MS)) k++;
            if (k >= text.length) continue;

            const fragment = document.createDocumentFragment();
            if (k > 0) fragment.appendChild(document.createTextNode(text.slice(0, k)));

            for (let j = k; j < text.length; j++) {
                let age = ageOf(start + j);
                if (!isFinite(age)) age = FADE_MS - 1;

                const span = document.createElement("span");
                span.className = "fi";
                span.style.animationDelay = (-Math.max(0, age)) + "ms";
                span.textContent = text[j];
                fragment.appendChild(span);
            }
            node.replaceWith(fragment);
        }
    };
}

/* =========================================
   GENERATION (streaming)
========================================= */
async function generate(restore = null) {

    const token = ++genToken;
    const alive = () => token === genToken;

    setBusy(true);
    abortController = new AbortController();

    statusEl.textContent = "● Thinking...";
    statusEl.className = "status thinking";

    const bubble = createBubble("bot");
    const pending = el("div", "pending-text", "Thinking");
    bubble.appendChild(pending);
    scrollToBottom(true, true);

    const rec = { role: "model", text: "", sources: [], images: [] };
    const fader = createFader();

    let received = "";     // everything the server has sent
    let shown = 0;         // how much of it is revealed
    let ended = false;
    let raf = null;
    let lastDraw = 0;
    let lastTime = 0;
    let carry = 0;
    let drawGap = 16;
    let dirty = false;
    let answerEl = null;
    let doneEvent = null;
    let errorMessage = "";
    let aborted = false;

    function draw(now) {
        if (!answerEl) {
            pending.remove();
            answerEl = el("div", "answer-content streaming");
            bubble.appendChild(answerEl);
        }
        // hide a half-typed "[Source 1" marker until its closing bracket arrives
        const visible = received.slice(0, shown).replace(/\s*\[\s*S[^\]\n]*$/i, "");
        answerEl.innerHTML = renderMarkdown(visible, rec.sources);
        fader(answerEl, now);
        scrollToBottom();
    }

    // Time-based reveal (characters per second scale with the backlog), so the pace is the
    // same on any screen and eases in and out. Render throttle adapts to render cost.
    function tick(now) {
        raf = null;
        if (!alive()) return;

        const dt = lastTime ? Math.min(now - lastTime, 100) : 16;
        lastTime = now;

        const backlog = received.length - shown;

        if (backlog > 0) {
            carry += Math.max(40, backlog * (ended ? 10 : 4)) * dt / 1000;
            const step = Math.floor(carry);
            if (step > 0) {
                carry -= step;
                shown = Math.min(received.length, shown + step);
                dirty = true;
            }
        }

        if (dirty && (now - lastDraw >= drawGap || shown >= received.length)) {
            const t0 = performance.now();
            draw(now);
            drawGap = Math.max(16, (performance.now() - t0) * 2);
            lastDraw = now;
            dirty = false;
        }

        if (shown < received.length || dirty) raf = requestAnimationFrame(tick);
        else lastTime = 0;
    }

    function handleEvent(evt) {
        if (!alive()) return;
        switch (evt.type) {
            case "status":
                if (!answerEl) pending.textContent = evt.text.replace(/…$/, "");
                statusEl.textContent = "● " + evt.text;
                break;
            case "meta":
                rec.sources = Array.isArray(evt.sources) ? evt.sources : [];
                rec.images = Array.isArray(evt.images) ? evt.images : [];
                addImageGallery(bubble, rec.images);        // fades in via CSS
                break;
            case "delta":
                received += evt.text;
                if (!raf) raf = requestAnimationFrame(tick);
                break;
            case "done":
                doneEvent = evt;
                break;
            case "error":
                errorMessage = evt.error || "Something went wrong.";
                break;
        }
    }

    function handleRaw(raw) {
        const line = raw.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trim()).join("");
        if (!line) return;
        try { handleEvent(JSON.parse(line)); } catch { /* ignore malformed event */ }
    }

    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: toContents() }),
            signal: abortController.signal
        });

        if (!response.ok || !response.body) {
            let message = `Server error: ${response.status}`;
            try { message = (await response.json()).error || message; } catch { /* not JSON */ }
            throw new Error(message);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");

            let index;
            while ((index = buffer.indexOf("\n\n")) !== -1) {
                handleRaw(buffer.slice(0, index));
                buffer = buffer.slice(index + 2);
            }
        }
        if (buffer.trim()) handleRaw(buffer);

        ended = true;
        if (!raf && shown < received.length) raf = requestAnimationFrame(tick);

        // let the typewriter finish, then let the last letters finish fading
        await new Promise(resolve => {
            const check = () => (!alive() || shown >= received.length || document.hidden) ? resolve() : setTimeout(check, 30);
            check();
        });
        if (alive() && received && !document.hidden) await wait(FADE_MS + 40);

    } catch (error) {
        if (error.name === "AbortError") aborted = true;
        else errorMessage = errorMessage || error.message;
    }

    if (raf) cancelAnimationFrame(raf);
    if (!alive()) { bubble.remove(); return; }       // the chat was switched or reset meanwhile

    // ----- Finish up -----
    const text = aborted ? received.slice(0, shown) : received;

    if (!text.trim()) {
        if (aborted) {
            bubble.remove();
            statusEl.textContent = "● Stopped";
            statusEl.className = "status";
        } else {
            bubble.replaceChildren();
            bubble.textContent = "Error: " + (errorMessage || "No response received.");
            bubble.classList.add("error");
            statusEl.textContent = "● Connection error";
            statusEl.className = "status error-status";

            if (restore) {                                   // give the message (and images) back
                records.pop();
                chatInput.value = restore.text;
                pendingImages = restore.attachments || [];
                renderPending();
                autosize();
                saveChat();
            }
        }
    } else {
        rec.text = text;
        if (doneEvent?.sources) rec.sources = doneEvent.sources;

        fillBotBubble(bubble, rec, true);

        const note =
            aborted ? "Stopped." :
            errorMessage ? errorMessage :
            doneEvent?.finishReason === "MAX_TOKENS" ? "Response reached the length limit." : "";

        if (note) bubble.insertBefore(el("div", "msg-note", note), bubble.querySelector(".msg-actions"));

        records.push(rec);
        saveChat();

        statusEl.textContent =
            doneEvent?.groundingUsed && doneEvent?.imageSearchSucceeded ? "● Answered using web search and images" :
            doneEvent?.groundingUsed ? "● Answered using web search" :
            doneEvent?.imageSearchSucceeded ? "● Answered with images" : "● Ready to chat";
        statusEl.className = "status";
    }

    abortController = null;
    setBusy(false);
    chatInput.focus();
    scrollToBottom();
}

function regenerate() {
    if (busy || records.at(-1)?.role !== "model") return;

    records.pop();
    chatMessages.lastElementChild?.remove();
    saveChat();
    generate();
}

/* =========================================
   SEND / STOP / NEW CHAT / RESTORE
========================================= */
chatForm.addEventListener("submit", (event) => {
    event.preventDefault();

    if (busy) {                                  // the send button is the Stop button while generating
        abortController?.abort();
        return;
    }

    const message = chatInput.value.trim();
    if (!message && !pendingImages.length) return;

    const attachments = pendingImages;
    pendingImages = [];
    renderPending();

    chatInput.value = "";
    autosize();

    const rec = { role: "user", text: message };
    if (attachments.length) rec.attachments = attachments;

    addUserMessage(rec);
    records.push(rec);
    saveChat();

    generate({ text: message, attachments });
});

newChat.addEventListener("click", () => {
    if (!records.length && !busy) { chatInput.focus(); return; }   // already an empty chat
    startNewChat();
});

window.addEventListener("DOMContentLoaded", () => {      // after the deferred marked/DOMPurify scripts
    store = readStore();

    const active = store.chats.find(c => c.id === store.activeId)
        || [...store.chats].sort((a, b) => b.updated - a.updated)[0];

    if (active) {
        store.activeId = active.id;
        records = active.records.map(r => ({ ...r }));
        renderConversation();
    } else {
        store.activeId = newId();
    }
    renderChatPanel();
});

/* =========================================
   CUSTOM CURSOR
   While it is ON, the real cursor is hidden everywhere in the page, and the browser's
   scrollbars are hidden too (the browser always draws its own arrow over scrollbars, which
   CSS cannot change). Wheel, touchpad and keyboard scrolling keep working.
   The custom cursor only shows while the pointer is inside the window.
========================================= */
const cursorToggle = document.getElementById("cursor-toggle");   // checkbox in the Notice popup
let cursorOn = true;
try { cursorOn = localStorage.getItem("custom-cursor") !== "off"; } catch { /* ignore */ }

function applyCursor() {
    document.documentElement.classList.toggle("custom-cursor", cursorOn);
    document.body.classList.toggle("custom-cursor", cursorOn);
    if (!cursorOn) document.body.classList.remove("cursor-visible");
    if (cursorToggle) cursorToggle.checked = cursorOn;
}

cursorToggle?.addEventListener("change", () => {
    cursorOn = cursorToggle.checked;
    try { localStorage.setItem("custom-cursor", cursorOn ? "on" : "off"); } catch { /* ignore */ }
    applyCursor();
});

window.addEventListener("mousemove", (e) => {
    if (!cursorOn || document.body.classList.contains("cursor-visible")) return;

    // first move (or re-entry): start the trailing ring at the pointer instead of sliding in
    try { ringX = e.clientX; ringY = e.clientY; } catch { /* variables not ready */ }
    document.body.classList.add("cursor-visible");
});

const hideCustomCursor = () => document.body.classList.remove("cursor-visible");
document.documentElement.addEventListener("mouseleave", hideCustomCursor);
window.addEventListener("blur", hideCustomCursor);

applyCursor();

/* =========================================
   CUSTOM CURSOR: optional (switch lives in the Notice popup) and never doubled up.
   The real cursor is hidden by CSS only while body.custom-cursor is set. The custom
   one is hidden whenever the real one has to show: before the first mouse move,
   over scrollbars (the browser always draws its own arrow there), and outside the window.
========================================= */
const cursorToggle = document.getElementById("cursor-toggle");   // checkbox in the popup
let cursorOn = true;
try { cursorOn = localStorage.getItem("custom-cursor") !== "off"; } catch { /* ignore */ }

function applyCursor() {
    document.body.classList.toggle("custom-cursor", cursorOn);
    if (!cursorOn) document.body.classList.remove("cursor-visible");
    if (cursorToggle) cursorToggle.checked = cursorOn;
}

cursorToggle?.addEventListener("change", () => {
    cursorOn = cursorToggle.checked;
    try { localStorage.setItem("custom-cursor", cursorOn ? "on" : "off"); } catch { /* ignore */ }
    applyCursor();
});

function overScrollbar(e) {
    for (let n = e.target; n && n.nodeType === 1; n = n.parentElement) {
        const cs = getComputedStyle(n);
        const r = n.getBoundingClientRect();

        if (/(auto|scroll)/.test(cs.overflowY) && n.scrollHeight > n.clientHeight &&
            e.clientX > r.left + n.clientLeft + n.clientWidth) return true;

        if (/(auto|scroll)/.test(cs.overflowX) && n.scrollWidth > n.clientWidth &&
            e.clientY > r.top + n.clientTop + n.clientHeight) return true;
    }
    const root = document.documentElement;
    return e.clientX >= root.clientWidth || e.clientY >= root.clientHeight;
}

let cursorEvent = null;
let cursorFrame = 0;

window.addEventListener("mousemove", (e) => {
    if (!cursorOn) return;
    cursorEvent = e;
    if (cursorFrame) return;
    cursorFrame = requestAnimationFrame(() => {
        cursorFrame = 0;
        document.body.classList.toggle("cursor-visible", !overScrollbar(cursorEvent));
    });
});

const hideCustomCursor = () => document.body.classList.remove("cursor-visible");
document.documentElement.addEventListener("mouseleave", hideCustomCursor);
window.addEventListener("blur", hideCustomCursor);

applyCursor();

/* =========================================
   CUSTOM CURSOR
========================================= */
const dot = document.querySelector(".cursor-dot");
const ring = document.querySelector(".cursor-ring");

let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
let ringX = mouseX, ringY = mouseY;
const CURSOR_SPEED = 0.18;

window.addEventListener("mousemove", (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    dot.style.left = mouseX + "px";
    dot.style.top = mouseY + "px";
});

(function animateRing() {
    ringX += (mouseX - ringX) * CURSOR_SPEED;
    ringY += (mouseY - ringY) * CURSOR_SPEED;
    ring.style.left = ringX + "px";
    ring.style.top = ringY + "px";
    requestAnimationFrame(animateRing);
})();

/* Event delegation: also works for elements created later (citations, copy buttons, source cards) */
const INTERACTIVE = "a, button, input, summary, [role='button']";

document.addEventListener("mouseover", (e) => {
    const on = !!(e.target.closest && e.target.closest(INTERACTIVE));
    ring.classList.toggle("hover", on);
    dot.classList.toggle("hover", on);
});

window.addEventListener("mousedown", () => ring.classList.add("click"));
window.addEventListener("mouseup", () => ring.classList.remove("click"));

/* =========================================
   NOTIFICATION POPUP
========================================= */
const popup = document.getElementById("notificationPopup");
const closeButton = document.getElementById("popupClose");
const confirmButton = document.getElementById("popupConfirm");
const noticeLink = document.getElementById("notice-link");

let previousFocus = null;

function showNotification(title, message) {
    previousFocus = document.activeElement;

    document.getElementById("popupTitle").textContent = title;
    document.querySelector(".popup-content h3").textContent = title;
    document.querySelector(".popup-content p").textContent = message;
  

    popup.hidden = false;
    document.body.style.overflow = "hidden";

    requestAnimationFrame(() => {
        popup.classList.add("active");
        closeButton.focus();
    });
}

function closeNotification() {
    popup.classList.remove("active");

    setTimeout(() => {
        popup.hidden = true;
        document.body.style.overflow = "";
        if (previousFocus) previousFocus.focus();
    }, 250);
}

noticeLink.addEventListener("click", () => showNotification("Important Notices", NOTICE_TEXT));
noticeLink.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        showNotification("Important Notices", NOTICE_TEXT);
    }
});

closeButton.addEventListener("click", closeNotification);
confirmButton.addEventListener("click", closeNotification);
popup.addEventListener("click", (e) => { if (e.target === popup) closeNotification(); });
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !popup.hidden) closeNotification();
});
</script>
