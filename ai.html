
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gemini AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f6fa;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 650px;
      max-height: 90vh;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 35px rgba(0,0,0,0.09);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 20px;
      background: #ffffff;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4285f4, #a142f4);
      color: white;
      display: grid;
      place-items: center;
      font-size: 22px;
    }

    .header-title h2 {
      margin: 0;
      font-size: 18px;
    }

    .status {
      color: #16a34a;
      font-size: 12px;
      margin-top: 4px;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg.bot {
      align-self: flex-start;
      background: #f0f2f6;
      color: #222;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .chat-footer {
      padding: 18px;
      border-top: 1px solid #eee;
    }

    #chat-form {
      display: flex;
      gap: 10px;
    }

    #chat-input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    #chat-input:focus {
      border-color: #4285f4;
    }

    #chat-send {
      border: none;
      border-radius: 10px;
      padding: 0 22px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #chat-send:hover {
      background: #1d4ed8;
    }

    #chat-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer-note {
      color: #999;
      text-align: center;
      font-size: 11px;
      margin-top: 12px;
    }

    @media (max-width: 500px) {
      body {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
      }

      .msg {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <header class="chat-header">
      <div class="header-title">
        <div class="ai-icon">✦</div>
        <div>
          <h2>Gemini AI</h2>
          <div class="status">● Ready to chat</div>
        </div>
      </div>

      <button id="new-chat"
        style="border:0;background:#eee;padding:10px 13px;border-radius:8px;cursor:pointer;">
        New chat
      </button>
    </header>

    <main id="chat-messages">
      <div class="msg bot">
        Hello! I'm Gemini. What would you like to know?
      </div>
    </main>

    <footer class="chat-footer">
      <form id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Message Gemini..."
          autocomplete="off"
          required
        >

        <button type="submit" id="chat-send">
          Send
        </button>
      </form>

      <div class="footer-note">
        Powered by Google Gemini
      </div>
    </footer>

  </div>

  <script>
    // IMPORTANT: Replace this with your NEW Cloudflare Worker URL.
    const WORKER_URL =
      "https://gemini-chat.mappinggerman04.workers.dev";

    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const chatMessages = document.getElementById("chat-messages");
    const chatSend = document.getElementById("chat-send");
    const newChat = document.getElementById("new-chat");

    // Stores the conversation while the page remains open.
    let history = [];

    function addMessage(text, sender) {
      const bubble = document.createElement("div");

      bubble.className = `msg ${sender}`;
      bubble.textContent = text;

      chatMessages.appendChild(bubble);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      return bubble;
    }

    newChat.addEventListener("click", () => {
      history = [];

      chatMessages.innerHTML = "";

      addMessage(
        "New conversation started. What would you like to know?",
        "bot"
      );
    });

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = chatInput.value.trim();

      if (!message || chatSend.disabled) return;

      // Display user's message.
      addMessage(message, "user");

      // Add message to conversation history.
      history.push({
        role: "user",
        parts: [{ text: message }]
      });

      chatInput.value = "";
      chatInput.disabled = true;
      chatSend.disabled = true;

      const loading = addMessage("Thinking...", "bot");

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            contents: history.slice(-20)
          })
        });

const responseText = await response.text();

let data;

try {
  data = JSON.parse(responseText);
} catch {
  throw new Error(
    `Server returned an invalid response (HTTP ${response.status}): ` +
    responseText.slice(0, 250)
  );
}

if (!response.ok) {
  throw new Error(data.error || `Request failed (${response.status}).`);
}

if (!data.reply) {
  throw new Error("The AI returned an empty response.");
}

return data.reply;
        if (!response.ok) {
          throw new Error(
            data.error || `Server error: ${response.status}`
          );
        }

        if (!data.reply) {
          throw new Error("Gemini returned no response.");
        }

        loading.textContent = data.reply;

        // Store Gemini's answer for conversational context.
        history.push({
          role: "model",
          parts: [{ text: data.reply }]
        });

      } catch (error) {
        console.error("Gemini error:", error);

        loading.textContent = "Error: " + error.message;
        loading.classList.add("error");

        // Remove failed user message from API history.
        history.pop();

      } finally {
        chatInput.disabled = false;
        chatSend.disabled = false;
        chatInput.focus();
      }
    });
  </script>

</body>
</html>
